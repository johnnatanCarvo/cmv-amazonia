<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMV | Amazônia na Cuia | CARVO (piloto)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Instrument+Sans:wght@400;500;600&family=Noto+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* ============================================================
   PILOTO — Design System CARVO (DESIGN.md)
   Nenhuma cor, fonte, medida ou canto fora de um token do :root.
   ============================================================ */
:root{
  /* paleta da marca */
  --carvo-black:#111211; --carvo-graphite:#1C1E1D; --carvo-offwhite:#F4F3EF; --carvo-light-gray:#E7E7E3;
  --carvo-mid-gray:#A6A8A5; --carvo-dark-green:#103F39; --carvo-cyan:#3FD6B3;
  /* fontes */
  --fonte-tit:'Instrument Sans',system-ui,sans-serif;
  --fonte-corpo:'Noto Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --num-exec:'IBM Plex Sans','Noto Sans',system-ui;
  --num-oper:'IBM Plex Sans','Noto Sans',system-ui;
  /* escuro (o :root nu) */
  --bg:#0E0F0E; --card:#1C1E1D; --card-alt:#232624; --linha:#2B2E2C; --linha-2:#3A3E3B;
  --txt:#F4F3EF; --txt2:#A6A8A5; --txt3:#909390;
  --verde:#3FD6B3; --verde-fr:rgba(63,214,179,.12); --positive:#5FB89B;
  --vermelho:#D3847D; --verm-fr:rgba(196,102,94,.14);
  --amarelo:#C99A3D; --amar-fr:rgba(201,154,61,.14); --mao:#C99A3D;
  --neutral:#6E726F; --azul:#7FB3A9; --sel-bg:#3FD6B3; --sel-txt:#111211;
  --serie-2:#D6A15E; --col-1:#2F6E62; --col-2:#24453E;
  /* menu lateral: preto nos dois temas */
  --lat-bg:#111211; --lat-linha:#2A2E2C; --lat-txt:#F4F3EF; --lat-txt2:#A6A8A5; --lat-txt3:#898C88;
  --lat-hover:#1C1E1D; --lat-verde:#3FD6B3; --lat-verde-fr:rgba(63,214,179,.10);
  --lat-trilho:#1C1E1D; --lat-pastilha:#2F3331; --lat-borda:#3D4340;
  --veu-gaveta:rgba(0,0,0,.55);
  /* medidas */
  --space-1:4px; --space-2:8px; --space-3:16px; --space-4:24px; --space-5:32px; --space-6:48px; --space-7:64px;
  --radius-sm:4px; --radius-md:6px; --sombra:none;
  --lat-w:232px; --lat-w-rec:68px; --lat-w-gav:268px; --lat-t:.22s;
}
html[data-theme="light"]{
  --bg:#FFFFFF; --card:#FFFFFF; --card-alt:#F6F6F3; --linha:#DFE0DC; --linha-2:#CBCDC8;
  --txt:#111211; --txt2:#535653; --txt3:#666966;
  --verde:#103F39; --verde-fr:rgba(16,63,57,.07); --positive:#2E6B4F;
  --vermelho:#9E3B33; --verm-fr:rgba(158,59,51,.09);
  --amarelo:#9A7524; --amar-fr:rgba(154,117,36,.10); --mao:#7E5F1D;
  --neutral:#A6A8A5; --azul:#7C9E97; --sel-bg:#103F39; --sel-txt:#FFFFFF;
  --serie-2:#8A5A2B; --col-1:#8CBDB3; --col-2:#C6DBD6;
  --lat-borda:var(--lat-linha);
}
*{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}
body{background:var(--bg);color:var(--txt);font-family:var(--fonte-corpo);font-size:14px;line-height:1.5;min-height:100vh;}
b,strong{font-weight:600;}
button{font-family:inherit;color:inherit;cursor:pointer;background:none;border:0;}
html.trocando-tema,html.trocando-tema *{transition:none !important;}
[hidden]{display:none !important;}
.num{font-family:var(--num-oper);font-variant-numeric:tabular-nums lining-nums;font-feature-settings:'tnum' 1;}

/* ---------- login ---------- */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:var(--space-4);}
.login-cartao{width:100%;max-width:380px;border:1px solid var(--linha);border-radius:var(--radius-md);background:var(--card);padding:var(--space-5);}
.login-logo{height:40px;width:auto;margin-bottom:var(--space-4);display:block;}
html[data-theme="light"] .login-logo{filter:invert(1);}
.login-cartao h1{font-family:var(--fonte-tit);font-size:17px;font-weight:600;letter-spacing:-.005em;margin-bottom:var(--space-1);}
.login-cartao p{font-size:12.5px;line-height:1.55;color:var(--txt2);margin-bottom:var(--space-4);}
.campo{display:flex;flex-direction:column;gap:var(--space-1);margin-bottom:var(--space-3);}
.campo > label{font-size:9.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--txt3);}
.campo input,.campo select{font-family:var(--fonte-corpo);font-size:14px;color:var(--txt);background:var(--card);border:1px solid var(--linha-2);border-radius:var(--radius-sm);padding:var(--space-2) var(--space-3);width:100%;}
.campo input:focus,.campo select:focus,button:focus-visible{outline:2px solid var(--verde);outline-offset:1px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);font-size:13px;font-weight:600;padding:var(--space-2) var(--space-3);border-radius:var(--radius-sm);border:1px solid var(--linha-2);color:var(--txt);}
.btn:hover{background:var(--card-alt);}
.btn.pri{background:var(--sel-bg);color:var(--sel-txt);border-color:var(--sel-bg);width:100%;padding:var(--space-3);}
.btn.pri:hover{background:var(--sel-bg);opacity:.92;}
.btn:disabled{opacity:.55;cursor:default;}
.erro{font-size:12.5px;color:var(--vermelho);min-height:20px;margin-top:var(--space-2);}

/* ---------- casca ---------- */
#app{display:flex;min-height:100vh;}
#lateral{position:sticky;top:0;align-self:flex-start;height:100vh;width:var(--lat-w);flex:0 0 var(--lat-w);background:var(--lat-bg);border-right:1px solid var(--lat-borda);display:flex;flex-direction:column;z-index:30;transition:width var(--lat-t) ease;overflow:hidden;}
#lateralEspaco{display:none;flex:0 0 var(--lat-w-rec);}
#lateral .lat-topo{display:flex;align-items:center;height:64px;border-bottom:1px solid var(--lat-linha);flex:0 0 auto;}
#lateral .lat-marca{position:relative;flex:1 1 auto;height:64px;}
/* A logo ocupa toda a faixa de cima do menu e nunca muda de tamanho nem de lugar (a marca fica centrada na barra recolhida).
   O que muda com a barra é só o recorte: recolhido mostra a marca; ao esticar, o recorte abre no mesmo tempo e ritmo da largura. */
#lateral .lat-logo{position:absolute;left:8px;top:calc((64px - 53.5px) / 2);width:210px;height:53.5px;clip-path:inset(0% 0% 0% 0%);transition:clip-path var(--lat-t) ease;image-rendering:auto;}
body.recolhido #lateral .lat-logo{clip-path:inset(0% 71.4% 0% 0%);}
body.recolhido #lateral.espiando .lat-logo{clip-path:inset(0% 0% 0% 0%);}
#lateral .lat-nome{font-family:var(--fonte-tit);font-size:15px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--lat-txt);font-kerning:normal;font-feature-settings:'kern' 1;white-space:nowrap;}
#lateral nav{flex:1 1 auto;overflow-y:auto;padding:var(--space-2) 0;}
.lat-sep{font-size:9px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--lat-txt3);padding:var(--space-4) var(--space-4) var(--space-2) 66px;border-top:1px solid var(--lat-linha);white-space:nowrap;}
.lat-sep:first-child{border-top:0;padding-top:var(--space-3);}
#lateral nav button{display:flex;align-items:center;width:100%;border-left:2px solid transparent;border-radius:0;padding:10px 0;font-family:var(--fonte-corpo);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--lat-txt2);text-align:left;}
#lateral nav button:hover{background:var(--lat-hover);color:var(--lat-txt);}
#lateral nav button.on{color:var(--lat-verde);background:var(--lat-verde-fr);border-left-color:var(--lat-verde);}
#lateral nav button:focus-visible{outline:2px solid var(--lat-verde);outline-offset:-2px;}
.lat-icone{flex:0 0 64px;display:flex;align-items:center;justify-content:center;}
.lat-icone svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
.lat-texto{white-space:nowrap;}
#lateral .lat-pe{flex:0 0 auto;border-top:1px solid var(--lat-linha);padding:var(--space-3) 0;}
.lat-pe .lat-linha{display:flex;align-items:center;min-height:36px;}
.lat-pe .lat-quem{font-size:11px;color:var(--lat-txt3);white-space:nowrap;}
.tema{display:flex;background:var(--lat-trilho);border-radius:var(--radius-sm);padding:2px;gap:2px;}
.tema button{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--lat-txt3);padding:6px 10px;border-radius:var(--radius-sm);border-left:2px solid transparent;}
.tema button.on{background:var(--lat-pastilha);color:var(--lat-txt);border-left-color:var(--lat-verde);}
.lat-btn{width:100%;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--lat-txt2);padding:10px 0;display:flex;align-items:center;}
.lat-btn:hover{color:var(--lat-txt);background:var(--lat-hover);}
#lateral .cinza,#lateral .verde{color:var(--lat-txt3);}
/* recolhido */
body.recolhido #lateral{width:var(--lat-w-rec);flex-basis:var(--lat-w-rec);}
body.recolhido .lat-texto,body.recolhido .lat-nome,body.recolhido .lat-sep,body.recolhido .lat-quem,body.recolhido .tema{display:none;}
body.recolhido #lateralEspaco{display:block;}
body.recolhido #lateral.espiando{position:fixed;left:0;top:0;width:var(--lat-w);z-index:40;}
body.recolhido #lateral.espiando .lat-texto,body.recolhido #lateral.espiando .lat-nome,body.recolhido #lateral.espiando .lat-sep,body.recolhido #lateral.espiando .lat-quem,body.recolhido #lateral.espiando .tema{display:flex;}
body.recolhido #lateral.espiando .lat-sep{display:block;}
body.recolhido #lateral.espiando .lat-nome{display:block;}

#conteudo{flex:1 1 auto;min-width:0;}
.head-topo{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--linha);}
.head-int{max-width:1480px;margin:0 auto;padding:var(--space-3) var(--space-4);display:flex;align-items:center;gap:var(--space-3);}
.head-tit-1{font-family:var(--fonte-tit);font-size:15px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-kerning:normal;font-feature-settings:'kern' 1;}
.head-tit-2{font-size:11px;color:var(--txt3);letter-spacing:.02em;}
.head-esp{flex:1 1 auto;}
.ico-btn{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--linha-2);border-radius:var(--radius-sm);}
.ico-btn:hover{background:var(--card-alt);}
.ico-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
#btnGaveta{display:none;}
main{max-width:1480px;margin:0 auto;padding:var(--space-5) var(--space-4) var(--space-7);}
.titulo-escopo{font-family:var(--fonte-tit);font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--txt3);margin-bottom:var(--space-2);}
.pagina-tit{font-family:var(--fonte-tit);font-size:30px;font-weight:500;letter-spacing:-.015em;line-height:1.15;color:var(--txt);}
.pagina-sub{font-size:13px;color:var(--txt2);margin-top:var(--space-1);}
.pagina-topo{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--space-4);flex-wrap:wrap;margin-bottom:var(--space-4);}
.controles{display:flex;gap:var(--space-3);align-items:flex-end;flex-wrap:wrap;}
.controles .campo{margin:0;min-width:160px;}
.seg{display:inline-flex;border:1px solid var(--linha-2);border-radius:var(--radius-sm);overflow:hidden;}
.seg button{font-size:12px;font-weight:500;color:var(--txt2);padding:var(--space-2) var(--space-3);border-left:1px solid var(--linha);}
.seg button:first-child{border-left:0;}
.seg button:hover{background:var(--card-alt);}
.seg button.on{background:var(--sel-bg);color:var(--sel-txt);}
.faixa{font-size:12px;line-height:1.6;color:var(--txt2);border:1px solid var(--linha);border-radius:var(--radius-sm);padding:var(--space-2) var(--space-3);margin-bottom:var(--space-3);}
.faixa b{color:var(--txt);}
.aviso{font-size:12.5px;line-height:1.55;color:var(--txt);background:var(--amar-fr);border:1px solid var(--amarelo);border-radius:var(--radius-md);padding:var(--space-3);margin-bottom:var(--space-3);}
.aviso .det{color:var(--txt2);font-size:12px;}

/* ---------- indicadores ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(212px,1fr));gap:var(--space-3);margin-bottom:var(--space-3);}
.kpi{background:var(--card);border:1px solid var(--linha);border-radius:var(--radius-md);padding:var(--space-4);box-shadow:var(--sombra);}
.kpi .rot{font-size:10.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--txt3);min-height:30px;line-height:1.45;}
.kpi .val{font-family:var(--num-exec);font-size:34px;font-weight:500;letter-spacing:-.022em;line-height:1.15;color:var(--txt);white-space:nowrap;font-variant-numeric:tabular-nums lining-nums;font-feature-settings:'tnum' 1;margin-top:var(--space-1);}
.kpi .var{margin-top:var(--space-2);}
.tag{display:inline-block;font-family:var(--num-oper);font-size:11.5px;font-weight:600;padding:2px var(--space-2);border-radius:var(--radius-sm);font-variant-numeric:tabular-nums lining-nums;}
.tag.bom{color:var(--positive);background:var(--verde-fr);}
.tag.mau{color:var(--vermelho);background:var(--verm-fr);}
.tag.neu{color:var(--txt2);background:var(--card-alt);}
.kpi .pe{font-family:var(--num-oper);font-size:11px;line-height:1.5;color:var(--txt3);margin-top:var(--space-1);}

/* ---------- cartões ---------- */
.cartao{background:var(--card);border:1px solid var(--linha);border-radius:var(--radius-md);padding:var(--space-4);box-shadow:var(--sombra);margin-bottom:var(--space-3);}
.cartao h3{font-family:var(--fonte-tit);font-size:14px;font-weight:600;letter-spacing:-.005em;color:var(--txt);}
.cartao .sub{font-size:12.5px;line-height:1.55;color:var(--txt2);margin-top:2px;margin-bottom:var(--space-3);}
.grade-2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:var(--space-3);}
.grafico{position:relative;height:260px;}
.insight{background:var(--carvo-dark-green);color:var(--carvo-offwhite);border-radius:var(--radius-md);padding:var(--space-4);margin-bottom:var(--space-3);font-size:14px;line-height:1.6;}
.insight .rot{font-size:10.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--carvo-mid-gray);margin-bottom:var(--space-2);}
.insight b{color:var(--carvo-cyan);font-family:var(--num-exec);font-weight:600;}

/* composição (EI + compras - EF) */
.formula{display:flex;align-items:stretch;gap:var(--space-3);flex-wrap:wrap;}
.formula .cx{flex:1 1 150px;border:1px solid var(--linha);border-radius:var(--radius-md);padding:var(--space-3);}
.formula .cx .v{font-family:var(--num-exec);font-size:20px;font-weight:500;letter-spacing:-.01em;white-space:nowrap;font-variant-numeric:tabular-nums lining-nums;}
.formula .cx .l{font-size:10.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--txt3);margin-top:var(--space-1);}
.formula .cx .d{font-family:var(--num-oper);font-size:11px;color:var(--txt3);}
.formula .cx.res{border-color:var(--linha-2);background:var(--card-alt);}
.formula .op{align-self:center;font-family:var(--num-exec);font-size:20px;color:var(--txt3);}

/* ---------- tabela ---------- */
.tabela{width:100%;border-collapse:collapse;}
thead th{font-size:10.5px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--txt3);text-align:left;padding:var(--space-2) var(--space-3);border-bottom:1px solid var(--linha-2);white-space:nowrap;}
thead th.num{text-align:right;}
tbody td{font-size:13px;color:var(--txt);padding:10px var(--space-3);border-bottom:1px solid var(--linha);text-align:left;vertical-align:middle;}
tbody td.num{text-align:right;font-family:var(--num-oper);font-variant-numeric:tabular-nums lining-nums;font-feature-settings:'tnum' 1;white-space:nowrap;}
tbody tr:hover td{background:var(--card-alt);}
tfoot td{font-size:13px;font-weight:600;padding:10px var(--space-3);border-top:1px solid var(--linha-2);}
tfoot td.num{text-align:right;font-family:var(--num-oper);font-variant-numeric:tabular-nums lining-nums;}
.barra{display:flex;align-items:center;justify-content:flex-end;gap:var(--space-2);min-width:120px;}
.barra i{display:block;height:6px;border-radius:var(--radius-sm);background:var(--col-1);}
.neg{color:var(--vermelho);}
.vazio{padding:var(--space-6) var(--space-4);text-align:center;color:var(--txt2);font-size:13px;border:1px dashed var(--linha-2);border-radius:var(--radius-md);}
.rodape{font-size:11px;color:var(--txt3);margin-top:var(--space-5);}

/* ---------- carregando ---------- */
#carregando{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:60;font-size:13px;color:var(--txt2);}

/* ---------- responsivo ---------- */
@media (max-width:900px){
  #lateral{position:fixed;left:0;top:0;width:var(--lat-w-gav);flex-basis:var(--lat-w-gav);transform:translateX(-100%);transition:transform .2s ease;z-index:50;}
  body.gaveta #lateral{transform:translateX(0);}
  body.gaveta::after{content:'';position:fixed;inset:0;background:var(--veu-gaveta);z-index:45;}
  body.recolhido #lateral{width:var(--lat-w-gav);}
  body.recolhido .lat-texto,body.recolhido .lat-nome,body.recolhido .lat-sep,body.recolhido .lat-quem,body.recolhido .tema{display:revert;}
  body.recolhido #lateralEspaco{display:none;}
  body.recolhido #lateral .lat-logo{clip-path:inset(0% 0% 0% 0%);}
  #btnGaveta{display:inline-flex;}
  #btnRecolher{display:none;}
  .grade-2{grid-template-columns:minmax(0,1fr);}
}
@media (max-width:780px){
  .pagina-tit{font-size:24px;}
  .kpi .val{font-size:26px;}
  main{padding:var(--space-4) var(--space-3) var(--space-6);}
  .head-int{padding:var(--space-2) var(--space-3);}
  .tabela,.tabela thead,.tabela tbody,.tabela tfoot,.tabela tr,.tabela td{display:block;width:100%;}
  .tabela thead{display:none;}
  .tabela tr{border:1px solid var(--linha);border-radius:var(--radius-md);padding:var(--space-2) var(--space-3);margin-bottom:var(--space-2);}
  .tabela td{border:0;padding:var(--space-1) 0;display:flex;justify-content:space-between;gap:var(--space-3);text-align:right !important;}
  .tabela td::before{content:attr(data-r);font-size:10.5px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--txt3);text-align:left;}
  .tabela td:first-child{font-weight:600;}
  tbody tr:hover td{background:transparent;}
}
@media (max-width:560px){
  .kpis{grid-template-columns:minmax(0,1fr);}
  .controles .campo{min-width:0;flex:1 1 100%;}
}

/* ---------- menu em grupos (estrutura do esboço: resumo, vendas, cmv, compras, estoque, ficha, financeiro) ---------- */
.lat-chev{margin-left:auto;margin-right:var(--space-3);width:14px;height:14px;display:flex;align-items:center;transition:transform .15s ease;}
.lat-chev svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
#lateral nav .lat-grupo.aberto > button.grupo .lat-chev{transform:rotate(180deg);}
#lateral nav .lat-grupo.tem-ativo > button.grupo{color:var(--lat-txt);}
.lat-sub{display:none;}
#lateral nav .lat-grupo.aberto > .lat-sub{display:block;}
#lateral nav button.sub{padding:7px var(--space-3) 7px 66px;font-size:11px;font-weight:500;letter-spacing:.03em;text-transform:none;color:var(--lat-txt2);}
#lateral nav button.sub.on{color:var(--lat-verde);}
body.recolhido .lat-sub,body.recolhido .lat-chev{display:none;}
body.recolhido #lateral.espiando .lat-chev{display:flex;}
body.recolhido #lateral.espiando .lat-grupo.aberto > .lat-sub{display:block;}
body.recolhido .tema{display:flex;flex-direction:column;}
body.recolhido #lateral.espiando .tema{flex-direction:row;}
.tema button{display:inline-flex;align-items:center;justify-content:center;padding:6px 10px;}
.tema button svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
#lateral .lat-pe .lat-linha{justify-content:center;padding:0 var(--space-3);}
@media (max-width:900px){
  body.recolhido .lat-chev{display:flex;}
  body.recolhido .lat-grupo.aberto > .lat-sub{display:block;}
  body.recolhido .tema{flex-direction:row;}
}
.controles .campo.estreito{min-width:0;}
.tag.cl{color:var(--txt);background:var(--card-alt);border:1px solid var(--linha-2);min-width:24px;text-align:center;}
.tag.cl.a{border-color:var(--txt2);}
.grade-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-3);}
.lista-chave{display:flex;flex-direction:column;gap:var(--space-2);}
.lista-chave .li{display:flex;justify-content:space-between;gap:var(--space-3);font-size:13px;border-bottom:1px solid var(--linha);padding-bottom:var(--space-2);}
.lista-chave .li span:last-child{font-family:var(--num-oper);font-variant-numeric:tabular-nums lining-nums;color:var(--txt2);text-align:right;}
a.btn{text-decoration:none;}
.em-obras{padding:var(--space-6) var(--space-4);text-align:center;border:1px dashed var(--linha-2);border-radius:var(--radius-md);}
.em-obras h3{margin-bottom:var(--space-2);}
.em-obras p{font-size:13px;color:var(--txt2);max-width:520px;margin:0 auto var(--space-3);line-height:1.6;}
@media (max-width:900px){.grade-3{grid-template-columns:minmax(0,1fr);}}
#lateral nav{scrollbar-width:thin;scrollbar-color:var(--lat-pastilha) transparent;}
#lateral nav::-webkit-scrollbar{width:6px;}
#lateral nav::-webkit-scrollbar-thumb{background:var(--lat-pastilha);border-radius:var(--radius-sm);}
.cartao{min-width:0;}
.tab-rol{overflow-x:auto;}
@media (max-width:780px){.tab-rol{overflow-x:visible;}}
.kpi .val.txt{font-family:var(--fonte-tit);font-size:22px;letter-spacing:-.01em;line-height:1.25;white-space:normal;overflow-wrap:anywhere;}
.lin-ficha{cursor:pointer;}
tr.det td{background:var(--card-alt);padding:var(--space-3);}
.tab-detalhe{width:100%;border-collapse:collapse;}
.tab-detalhe th{font-size:9.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--txt3);text-align:left;padding:var(--space-1) var(--space-2);border-bottom:1px solid var(--linha-2);}
.tab-detalhe th.num{text-align:right;}
.tab-detalhe td{font-size:12.5px;padding:6px var(--space-2);border-bottom:1px solid var(--linha);text-align:left;}
.tab-detalhe td.num{text-align:right;font-family:var(--num-oper);font-variant-numeric:tabular-nums lining-nums;white-space:nowrap;}
@media (max-width:780px){tr.det td{display:block;}.tab-detalhe thead{display:none;}.tab-detalhe tr{display:block;border:0;}.tab-detalhe td{display:flex;justify-content:space-between;border:0;}}
</style>
</head>

/* ---------- formatação ---------- */
function brl(v,casas){
  if(v===null||v===undefined||isNaN(v))return '--';
  var c=casas===undefined?0:casas;
  return 'R$ '+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:c,maximumFractionDigits:c});
}
function pct(v){return (v===null||v===undefined||isNaN(v))?'--':Number(v).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%';}
function nr(v,c){return (v===null||v===undefined||isNaN(v))?'--':Number(v).toLocaleString('pt-BR',{minimumFractionDigits:c||0,maximumFractionDigits:c||0});}
function mesNome(m){return MESES_NOME[m]||m;}

/* ---------- tema ---------- */
function aplicarTema(t){
  var h=document.documentElement;
  h.classList.add('trocando-tema');
  h.setAttribute('data-theme',t);
  lsSet('carvo_tema',t);
  document.querySelectorAll('[data-tema]').forEach(function(b){b.classList.toggle('on',b.dataset.tema===t);});
  void document.body.offsetHeight;          // força o recálculo antes de soltar a trava
  h.classList.remove('trocando-tema');
  if(D)desenhar();
}
function paletaGrafico(){
  var cs=getComputedStyle(document.documentElement);
  var g=function(n){return cs.getPropertyValue(n).trim();};
  return {verde:g('--verde'),serie2:g('--serie-2'),col1:g('--col-1'),col2:g('--col-2'),neutral:g('--neutral'),azul:g('--azul'),linha:g('--linha'),txt2:g('--txt2'),txt3:g('--txt3'),card:g('--card'),txt:g('--txt'),fonte:g('--num-oper')};
}

/* ---------- dados ---------- */
function mesesDisp(){return (D&&D.meses)||[];}
function ant(m){var l=mesesDisp(),i=l.indexOf(m);return i>0?l[i-1]:null;}
function fatMes(m,uni){
  if(uni&&uni!=='TODAS'){var c1=cmvMes(m,uni);if(c1&&c1.fat)return c1.fat;var k1=cmcMes(m,uni);return k1?k1.fat:0;}
  if(D.cmv&&D.cmv[m]&&D.cmv[m].faturamento)return D.cmv[m].faturamento;
  if(D.cmc&&D.cmc[m]&&D.cmc[m].faturamento)return D.cmc[m].faturamento;
  var bm=(D.vendas&&D.vendas.by_mes||[]).filter(function(x){return x.mes===m;})[0];
  return bm?bm.valor:0;
}
function cmvMes(m,uni){
  var c=D.cmv&&D.cmv[m]; if(!c)return null;
  if(!uni||uni==='TODAS')return {ei:c.ei_total,ef:c.ef_total,compras:c.compras_total,cmv:c.cmv_total,pct:c.cmv_pct,fat:c.faturamento||0,
    dataEi:c.data_ei,dataEf:c.data_ef,contEi:c.contagem_ei,contEf:c.contagem_ef,abertura:!!c.ei_abertura,grupos:c.grupos||[]};
  var f=c.filiais&&c.filiais[uni]; if(!f)return null;
  return {ei:f.ei,ef:f.ef,compras:f.compras,cmv:f.cmv,pct:f.cmv_pct,fat:f.faturamento||0,
    dataEi:c.data_ei,dataEf:c.data_ef,contEi:c.contagem_ei,contEf:c.contagem_ef,abertura:!!c.ei_abertura,grupos:f.grupos||[]};
}
function cmcMes(m,uni){
  var c=D.cmc&&D.cmc[m]; if(!c)return null;
  var o=(!uni||uni==='TODAS')?c:(c.filiais&&c.filiais[uni]);
  if(!o)return null;
  var fat=(o.faturamento!==undefined?o.faturamento:0)||0;
  var total=o.cmc_total||0;
  var grupos=Object.keys(o.grupos||{}).map(function(g){var x=o.grupos[g];return {nome:g,total:x.total||0,pct:x.pct_cmc,produtos:x.produtos||[]};}).sort(function(a,b){return b.total-a.total;});
  return {total:total,fat:fat,pct:fat>0?total/fat*100:null,grupos:grupos};
}
function teoricoMes(m,uni){
  var t=D.cmvTeorico&&D.cmvTeorico[m]; if(!t)return null;
  var o=(!uni||uni==='TODAS')?t:(t.filiais&&t.filiais[uni]);
  return o||null;
}
function abcMes(m,uni){
  var v=D.vendas; if(!v)return null;
  if(!uni||uni==='TODAS')return v.abc_mes&&v.abc_mes[m]||null;
  return v.abc_mes_filial&&v.abc_mes_filial[m]&&v.abc_mes_filial[m][uni]||null;
}
function unidades(){
  var s={};
  mesesDisp().forEach(function(m){
    ['cmv','cmc'].forEach(function(k){var o=D[k]&&D[k][m];if(o&&o.filiais)Object.keys(o.filiais).forEach(function(f){s[f]=1;});});
  });
  return Object.keys(s).sort();
}
function nomeUni(u){return u==='TODAS'?'Todas as unidades':u.toLowerCase().replace(/(^|\s)\S/g,function(c){return c.toUpperCase();});}

/* ---------- peças ---------- */
function tagVar(atual,anterior,custo){
  // custo: subir é ruim (vermelho) e descer é bom
  if(atual==null||anterior==null||!isFinite(atual)||!isFinite(anterior))return '<span class="tag neu">sem comparação</span>';
  var d=atual-anterior;
  if(Math.abs(d)<0.05)return '<span class="tag neu">estável</span>';
  var sobe=d>0, ruim=custo?sobe:!sobe;
  return '<span class="tag '+(ruim?'mau':'bom')+'">'+(sobe?'▲ +':'▼ ')+Math.abs(d).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+' p.p.</span>';
}
function tagVarPct(atual,anterior,custo){
  if(!anterior||atual==null)return '<span class="tag neu">sem comparação</span>';
  var p=(atual-anterior)/anterior*100;
  if(Math.abs(p)<0.05)return '<span class="tag neu">estável</span>';
  var cls='neu'; if(custo!==undefined)cls=((p>0)===!!custo)?'mau':'bom';
  return '<span class="tag '+cls+'">'+(p>0?'▲ +':'▼ ')+Math.abs(p).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%</span>';
}
function kpi(rot,val,tag,pe,txt){
  return '<div class="kpi"><div class="rot">'+rot+'</div><div class="val'+(txt?' txt':'')+'">'+val+'</div>'+
    (tag?'<div class="var">'+tag+'</div>':'')+(pe?'<div class="pe">'+pe+'</div>':'')+'</div>';
}
function vazio(msg,grid){return '<div class="vazio"'+(grid?' style="grid-column:1/-1"':'')+'>'+msg+'</div>';}
function cartao(tit,sub,corpo){return '<div class="cartao"><h3>'+tit+'</h3>'+(sub?'<p class="sub">'+sub+'</p>':'')+corpo+'</div>';}
function tabela(cols,linhas,rodape){
  if(!linhas.length)return vazio('Sem dados para este recorte.');
  var th=cols.map(function(c){return '<th class="'+(c.num?'num':'')+'">'+esc(c.t)+'</th>';}).join('');
  var tr=linhas.map(function(l){return '<tr>'+l.map(function(cel,i){return '<td data-r="'+esc(cols[i].t)+'" class="'+(cols[i].num?'num':'')+'">'+cel+'</td>';}).join('')+'</tr>';}).join('');
  var tf=rodape?'<tfoot><tr>'+rodape.map(function(cel,i){return '<td data-r="'+esc(cols[i].t)+'" class="'+(cols[i].num?'num':'')+'">'+cel+'</td>';}).join('')+'</tr></tfoot>':'';
  return '<div class="tab-rol"><table class="tabela"><thead><tr>'+th+'</tr></thead><tbody>'+tr+'</tbody>'+tf+'</table></div>';
}
function barra(valor,max,texto,neg){
  return '<div class="barra"><i style="width:'+Math.max(2,Math.round(Math.abs(valor||0)/(max||1)*100))+'px"></i><span class="'+(neg?'neg':'')+'">'+texto+'</span></div>';
}

function matarGraficos(){Object.keys(CHARTS).forEach(function(k){if(CHARTS[k]){CHARTS[k].destroy();CHARTS[k]=null;}});}
function opcoesGrafico(fmt,empilhado){

    scales:{x:{stacked:!!empilhado,grid:{display:false},ticks:{color:p.txt3}},y:{stacked:!!empilhado,grid:{color:p.linha},ticks:{color:p.txt3,callback:function(v){return fmt(v);}},border:{display:false}}}};
}

function fmtMil(v){return v==null?'--':'R$ '+Number(v/1000).toLocaleString('pt-BR',{maximumFractionDigits:0})+' mil';}

function vGeral(){
  var c=cmvMes(MES,'TODAS'), k=cmcMes(MES,'TODAS'), m0=ant(MES);
  var c0=m0?cmvMes(m0,'TODAS'):null, k0=m0?cmcMes(m0,'TODAS'):null;
  var fat=fatMes(MES), fat0=m0?fatMes(m0):0;
  var pe0=m0?'contra '+mesNome(m0):'primeiro mês com dados';
  var h='<div class="kpis">';
  h+=kpi('Faturamento',brl(fat),m0?tagVarPct(fat,fat0):'<span class="tag neu">sem comparação</span>',pe0);
  h+=kpi('CMV real',c?brl(c.cmv):'--',c&&c0?tagVar(c.pct,c0.pct,true):'<span class="tag neu">sem comparação</span>',c?pct(c.pct)+' do faturamento':'sem contagem de estoque no mês');
  h+=kpi('CMC',k?brl(k.total):'--',k&&k0?tagVar(k.pct,k0.pct,true):'<span class="tag neu">sem comparação</span>',k?pct(k.pct)+' do faturamento':'');
  h+=kpi('Compras no CMV',c?brl(c.compras):'--','',c?'estoque inicial '+brl(c.ei)+' · final '+brl(c.ef):'');
  h+='</div>';
  var ins='';
  if(c&&c.pct!=null){
    var dif=(c0&&c0.pct!=null)?c.pct-c0.pct:null;
    var top=(c.grupos||[]).slice().sort(function(a,b){return (b.cmv||0)-(a.cmv||0);})[0];
    ins='O CMV de '+mesNome(MES)+' ficou em <b>'+pct(c.pct)+'</b> do faturamento'+
      (dif!=null?', '+(Math.abs(dif)<0.05?'estável em relação a':(Math.abs(dif).toLocaleString('pt-BR',{maximumFractionDigits:1})+' p.p. '+(dif>0?'acima de':'abaixo de')))+' '+mesNome(m0):'')+'. '+
      (top?'O grupo que mais pesou foi '+esc(top.grupo)+', com '+brl(top.cmv)+'.':'');
  }else if(k&&k.pct!=null){
    ins='Sem contagem de estoque fechando '+mesNome(MES)+', não há CMV real. O custo de compra foi de <b>'+pct(k.pct)+'</b> do faturamento.';
  }else ins='Ainda não há dados suficientes neste mês.';

  return {html:h,post:function(){
    var p=paletaGrafico(), ms=mesesDisp();

      {type:'bar',label:'CMV real',data:ms.map(function(m){var x=cmvMes(m,'TODAS');return x&&x.pct!=null?x.pct:null;}),backgroundColor:corMes(ms,p),borderRadius:4,maxBarThickness:36},
      {type:'line',label:'CMC',data:ms.map(function(m){var x=cmcMes(m,'TODAS');return x&&x.pct!=null?x.pct:null;}),borderColor:p.serie2,backgroundColor:p.serie2,borderWidth:2,pointRadius:3,tension:.25}]},options:opcoesGrafico(fmtPct)});

function vCmv(){
  var c=cmvMes(MES,UNI), m0=ant(MES), c0=m0?cmvMes(m0,UNI):null;
  if(!c)return {html:vazio('Não há CMV real para '+esc(mesNome(MES))+' nesta unidade: falta contagem de estoque no início e no fim do período.')};
  var h='';
  if(c.dataEi)h+='<div class="faixa"><b>Período considerado</b> &nbsp;·&nbsp; Compras e vendas: '+esc(c.dataEi)+' a '+esc(c.dataEf)+
    ' &nbsp;·&nbsp; Contagens: '+esc(c.contEi||c.dataEi)+(c.abertura?' (abertura, estoque R$ 0)':'')+' &rarr; '+esc(c.contEf||c.dataEf)+'</div>';
  h+='<div class="kpis">'+
    kpi('CMV real',brl(c.cmv),c0?tagVar(c.pct,c0.pct,true):'<span class="tag neu">sem comparação</span>',pct(c.pct)+' do faturamento')+
    kpi('Estoque inicial',brl(c.ei),'','contagem de '+esc(c.contEi||c.dataEi))+
    kpi('Compras',brl(c.compras),'','no período')+
    kpi('Estoque final',brl(c.ef),'','contagem de '+esc(c.contEf||c.dataEf))+'</div>';
  h+=cartao('Composição do CMV','Estoque inicial mais o que foi comprado, menos o estoque final.',
    '<div class="formula">'+
    '<div class="cx"><div class="v">'+brl(c.ei,2)+'</div><div class="l">Estoque inicial</div><div class="d">'+esc(c.contEi||c.dataEi||'')+'</div></div><div class="op">+</div>'+
    '<div class="cx"><div class="v">'+brl(c.compras,2)+'</div><div class="l">Compras</div><div class="d">no período</div></div><div class="op">&minus;</div>'+
    '<div class="cx"><div class="v">'+brl(c.ef,2)+'</div><div class="l">Estoque final</div><div class="d">'+esc(c.contEf||c.dataEf||'')+'</div></div><div class="op">=</div>'+
    '<div class="cx res"><div class="v">'+brl(c.cmv,2)+'</div><div class="l">CMV real</div><div class="d">'+pct(c.pct)+' do faturamento</div></div></div>');
  var gs=(c.grupos||[]).slice().sort(function(a,b){return (b.cmv||0)-(a.cmv||0);});

    kpi('Insumos diferentes',nr(it.length),'','com demanda no mês')+
    kpi('Maior insumo',esc(it[0].nome),'',brl(it[0].custo_total)+' · '+pct(total?it[0].custo_total/total*100:null)+' do total',true)+'</div>';
  h+=cartao('Insumos pelo custo da demanda','Os 30 maiores. Quantidade e custo vêm da ficha técnica × vendas.',tabela([{t:'Insumo'},{t:'Und.'},{t:'Quantidade',num:1},{t:'Custo unit.',num:1},{t:'Custo total',num:1},{t:'%',num:1},{t:'Principal origem'}],
    it.slice(0,30).map(function(i){var o=(i.origens||[])[0];return [esc(i.nome),esc(i.und||''),nr(i.qtde,1),brl(i.custo_unit,2),barra(i.custo_total,max,brl(i.custo_total)),pct(total?i.custo_total/total*100:null),o?esc(o.produto):''];})));
  return {html:h};
}
/* ---------- ficha técnica: vem da API do Cloudfy (cache diário), não do app antigo de fichas ---------- */
var FICHAS=null, FICHAS_ERRO='', FICHAS_EM=''; var FICHA_Q='', FICHA_G='', FICHA_ABERTAS={}, FICHA_CARREGANDO=false;
function carregarFichas(){
  if(FICHA_CARREGANDO)return; FICHA_CARREGANDO=true;
  google.script.run
    .withSuccessHandler(function(json){
      FICHA_CARREGANDO=false; var r; try{r=JSON.parse(json);}catch(e){r=null;}
      if(!r||!r.ok){FICHAS_ERRO=(r&&r.erro)||'Não foi possível ler as fichas.';FICHAS=[];}
      else{FICHAS=r.fichas||[];FICHAS_EM=r.atualizadoEm||'';FICHAS_ERRO='';}
      if(VISTA==='ficha')desenhar();
    })
    .withFailureHandler(function(e){FICHA_CARREGANDO=false;FICHAS_ERRO='Falha na comunicação: '+((e&&e.message)||e);FICHAS=[];if(VISTA==='ficha')desenhar();})
    .listarFichasApi(SENHA);
}
function fichasFiltradas(){
  var q=FICHA_Q.trim().toLowerCase();
  return (FICHAS||[]).filter(function(f){
    if(FICHA_G&&f.grupo!==FICHA_G)return false;
    return !q||f.produto.toLowerCase().indexOf(q)>=0||String(f.cod).toLowerCase()===q;
  });
}
function listaFichasHtml(){
  var lista=fichasFiltradas(), tot=lista.length, vis=lista.slice(0,100);
  if(!vis.length)return vazio('Nenhuma ficha encontrada para esta busca.');
  var th=['Produto','Grupo','Tipo','Rendimento','Custo unit.','Insumos'].map(function(c,i){return '<th class="'+(i>=3?'num':'')+'">'+c+'</th>';}).join('');
  var tr=vis.map(function(f){
    var k=f.cod+'|'+f.produto, aberta=!!FICHA_ABERTAS[k];
    var linha='<tr class="lin-ficha" data-ficha="'+esc(k)+'"><td data-r="Produto">'+esc(f.produto)+'</td><td data-r="Grupo">'+esc(f.grupo||'--')+'</td><td data-r="Tipo">'+esc(f.tipo||'--')+'</td>'+
      '<td class="num" data-r="Rendimento">'+nr(f.rendimento,2)+' '+esc(f.unidade||'')+'</td><td class="num" data-r="Custo unit.">'+brl(f.custoUnit,2)+'</td><td class="num" data-r="Insumos">'+f.insumos.length+'</td></tr>';
    if(!aberta)return linha;
    var ins=f.insumos.length?'<table class="tab-detalhe"><thead><tr><th>Insumo</th><th class="num">Quantidade</th><th>Und.</th><th class="num">Custo unit.</th><th class="num">Custo total</th></tr></thead><tbody>'+
      f.insumos.map(function(i){return '<tr><td>'+esc(i.nome)+'</td><td class="num">'+nr(i.qtde,3)+'</td><td>'+esc(i.und)+'</td><td class="num">'+brl(i.custoUnit,2)+'</td><td class="num">'+brl(i.custoTotal,2)+'</td></tr>';}).join('')+'</tbody></table>':vazio('Esta ficha não tem insumos na API.');
    return linha+'<tr class="det"><td colspan="6">'+ins+'</td></tr>';
  }).join('');
  return '<div class="tab-rol"><table class="tabela tab-ficha"><thead><tr>'+th+'</tr></thead><tbody>'+tr+'</tbody></table></div>'+
    (tot>vis.length?'<p class="rodape">Mostrando '+vis.length+' de '+tot+' fichas. Refine a busca para ver as outras.</p>':'');
}
function pintarFichas(){var el=$('fichaLista');if(el)el.innerHTML=listaFichasHtml();}
function vFicha(){
  if(FICHAS===null){return {html:vazio('Lendo as fichas na API do Cloudfy…'),post:carregarFichas};}
  if(FICHAS_ERRO)return {html:vazio(esc(FICHAS_ERRO))};
  if(!FICHAS.length)return {html:vazio('Ainda não há fichas no cache da API. Elas chegam na atualização diária do Cloudfy.')};
  var vendas=FICHAS.filter(function(f){return f.tipo==='Venda';}).length;
  var grupos={}; FICHAS.forEach(function(f){if(f.grupo)grupos[f.grupo]=1;});
  var gl=Object.keys(grupos).sort();
  var h='<div class="kpis">'+kpi('Fichas',nr(FICHAS.length),'','vindas da API do Cloudfy')+kpi('Produtos de venda',nr(vendas),'','tipo Venda')+
    kpi('Preparos e matérias-primas',nr(FICHAS.length-vendas),'','sub-receitas')+kpi('Atualizado em',esc((FICHAS_EM||'--').split(' ')[0]),'',esc((FICHAS_EM||'').split(' ')[1]||'')+' · cache diário da API',true)+'</div>';
  h+='<div class="cartao"><h3>Fichas técnicas</h3><p class="sub">Clique numa ficha para ver os insumos. O custo é o que o Cloudfy calcula.</p>'+
    '<div class="controles" style="margin-bottom:var(--space-3)"><div class="campo" style="flex:1 1 260px"><label for="fichaQ">Buscar produto ou código</label><input id="fichaQ" type="search" value="'+esc(FICHA_Q)+'" autocomplete="off"></div>'+
    '<div class="campo"><label for="fichaG">Grupo</label><select id="fichaG"><option value="">Todos os grupos</option>'+gl.map(function(g){return '<option value="'+esc(g)+'"'+(g===FICHA_G?' selected':'')+'>'+esc(g)+'</option>';}).join('')+'</select></div></div>'+
    '<div id="fichaLista">'+listaFichasHtml()+'</div></div>';
  return {html:h};
}
function vEmObras(nome){
  return function(){
    return {html:'<div class="em-obras"><h3>'+nome+' em implantação</h3><p>O demonstrativo financeiro vive no painel executivo financeiro, que é outro aplicativo. Este piloto já tem o lugar e o padrão visual dele no menu; falta conectar a fonte de dados.</p></div>'};
  };
}
function vConfig(){
  var tema=document.documentElement.getAttribute('data-theme');
  var h='<div class="grade-2">'+
    cartao('Aparência','O tema vale só neste navegador.','<div class="seg"><button data-tema="light" class="'+(tema==='light'?'on':'')+'">Claro</button><button data-tema="dark" class="'+(tema==='dark'?'on':'')+'">Escuro</button></div>'+
      '<p class="sub" style="margin-top:var(--space-3);margin-bottom:var(--space-2)">Menu lateral</p><button class="btn" id="cfgMenu">Recolher ou expandir o menu</button>')+
    cartao('Acesso','','<div class="lista-chave"><div class="li"><span>Negócio</span><span>Amazônia na Cuia</span></div><div class="li"><span>Senha</span><span>lembrada só neste navegador</span></div></div>'+
      '<div style="margin-top:var(--space-3)"><button class="btn" id="cfgSair">Sair</button></div>')+'</div>';
  h+=cartao('Outros painéis','As telas que ainda não foram para o novo padrão continuam nos painéis atuais.',
    '<div style="display:flex;gap:var(--space-2);flex-wrap:wrap"><button class="btn" data-ext="painel">Abrir o painel atual</button></div>');
  return {html:h};
}

/* ---------- moldura de cada tela ---------- */
var VIEWS={
  geral:{escopo:'Resumo',tit:function(){return mesNome(MES);},sub:'Faturamento, custo de compra e custo da mercadoria vendida do mês.',ctl:['mes'],avisos:1,render:vGeral},
  cmc:{escopo:'Resumo · custo da mercadoria comprada',tit:'CMC',sub:function(){return mesNome(MES)+' · '+nomeUni(UNI);},ctl:['mes','uni'],avisos:1,render:vCmc},
  cmv:{escopo:'Resumo · custo da mercadoria vendida',tit:'CMV real',sub:function(){return mesNome(MES)+' · '+nomeUni(UNI);},ctl:['mes','uni'],avisos:1,render:vCmv},
  mesames:{escopo:'Resumo',tit:'Gráfico mês a mês',sub:function(){return nomeUni(UNI);},ctl:['uni'],render:vMesAMes},
  fatuni:{escopo:'Resumo',tit:'Faturamento por unidade',sub:'Quanto cada unidade vendeu.',ctl:['mes'],render:vFatUni},
  abc:{escopo:'Resumo',tit:'Curva ABC',sub:function(){return mesNome(MES)+' · '+nomeUni(UNI);},ctl:['mes','uni'],render:vAbc},
  vendas:{escopo:'Vendas',tit:'Vendas',sub:function(){return mesNome(MES)+' · '+nomeUni(UNI);},ctl:['mes','uni'],render:vVendas},
  realteorico:{escopo:'CMV',tit:'Real × Teórico',sub:function(){return mesNome(MES)+' · '+nomeUni(UNI);},ctl:['mes','uni'],render:vRealTeorico},
  compras:{escopo:'Compras',tit:'Análise mês a mês',sub:function(){return nomeUni(UNI);},ctl:['mes','uni'],avisos:1,render:vCompras},
  variacao:{escopo:'Compras',tit:'Variação de custo',sub:function(){return mesNome(MES)+' contra o mês anterior · '+nomeUni(UNI);},ctl:['mes','uni'],render:vVariacao},
  demanda:{escopo:'Estoque',tit:'Demanda de insumos',sub:function(){return mesNome(MES)+' · '+nomeUni(UNI);},ctl:['mes','uni'],render:vDemanda},
  ficha:{escopo:'Ficha técnica',tit:'Ficha técnica',sub:'Receitas e custos direto da API do Cloudfy.',ctl:[],render:vFicha},
  dfc:{escopo:'Financeiro',tit:'DFC',sub:'Demonstrativo de fluxo de caixa.',ctl:[],render:vEmObras('DFC')},
  dre:{escopo:'Financeiro',tit:'DRE',sub:'Demonstrativo de resultado.',ctl:[],render:vEmObras('DRE')},
  config:{escopo:'Configuração',tit:'Configuração',sub:'Aparência, acesso e atalhos.',ctl:[],render:vConfig}
};
function val(x){return typeof x==='function'?x():x;}
function controles(ctl){
  var h='';
  if(ctl.indexOf('mes')>=0)h+='<div class="campo"><label>Mês</label><div class="seg">'+mesesDisp().map(function(m){return '<button data-mes="'+m+'" class="'+(m===MES?'on':'')+'">'+esc(MESES_CURTO[m]||m)+'</button>';}).join('')+'</div></div>';
  if(ctl.indexOf('uni')>=0)h+='<div class="campo"><label for="selUni">Unidade</label><select id="selUni">'+['TODAS'].concat(unidades()).map(function(u){return '<option value="'+esc(u)+'"'+(u===UNI?' selected':'')+'>'+esc(nomeUni(u))+'</option>';}).join('')+'</select></div>';
  return h;
}
function desenharAvisos(v){
  var el=$('avisos'); el.innerHTML='';
  if(!v||!v.avisos)return;
  var l=(D.comprasNaoIntegradas||{})[MES]||[];
  var total=l.reduce(function(s,f){return s+(f.valor||0);},0);
  if(total<=0)return;
  var det=l.filter(function(f){return (f.valor||0)>0;}).map(function(f){return esc(f.filial)+' '+brl(f.valor,2);}).join(' · ');
  el.innerHTML='<div class="aviso"><b>'+brl(total,2)+' em insumos de '+esc(mesNome(MES))+' ainda não conciliados no Cloudfy.</b> Esse valor não entra no CMC enquanto as notas não forem vinculadas aos produtos.<div class="det">'+det+'</div></div>';
}
function desenhar(){
  if(!D)return;
  var v=VIEWS[VISTA]||VIEWS.geral;
  matarGraficos();
  desenharAvisos(v);
  $('headSub').textContent=v.escopo;
  $('vista').innerHTML='<div class="titulo-escopo">'+esc(v.escopo)+'</div>'+
    '<div class="pagina-topo"><div><h1 class="pagina-tit">'+esc(val(v.tit))+'</h1><p class="pagina-sub">'+esc(val(v.sub)||'')+'</p></div><div class="controles">'+controles(v.ctl||[])+'</div></div><div id="vc"></div>';
  var r=v.render();
  $('vc').innerHTML=r.html;
  if(r.post)r.post();
  marcarMenu();
}
function irPara(v){
  if(!VIEWS[v])v='geral';
  VISTA=v;
  NAV.forEach(function(n){if(n.subs&&(n.page===v||n.subs.some(function(s){return s[0]===v;})))GRUPOS_ABERTOS[n.id]=true;});
  document.body.classList.remove('gaveta');
  window.scrollTo(0,0);
  desenhar();
}

/* ---------- entrada ---------- */
function carregar(senha,auto){
  var btn=$('btnEntrar'), err=$('erroLogin');
  btn.disabled=true; btn.textContent='Verificando…'; err.textContent='';
  google.script.run
    .withSuccessHandler(function(json){
      var r; try{r=JSON.parse(json);}catch(e){r=null;}
      btn.disabled=false; btn.textContent='Entrar';
      $('carregando').hidden=true;
      if(!r||!r.ok){
        if(r&&r.auth===false){lsDel('carvo_senha_piloto');err.textContent=auto?'':'Senha incorreta.';}
        else err.textContent=(r&&r.erro)||'Erro ao carregar os dados.';
        $('login').hidden=false; $('app').hidden=true; return;
      }
      SENHA=senha; lsSet('carvo_senha_piloto',senha); D=r;
      var l=mesesDisp(); if(!MES||l.indexOf(MES)<0)MES=l.length?l[l.length-1]:''; UNI='TODAS';
      $('login').hidden=true; $('app').hidden=false;
      irPara(VISTA);
    })
    .withFailureHandler(function(e){
      btn.disabled=false; btn.textContent='Entrar'; $('carregando').hidden=true;
      err.textContent='Falha na comunicação: '+((e&&e.message)||e);
      $('login').hidden=false;
    })
    .getPayload(senha,NEGOCIO);
}
function entrar(ev){
  ev.preventDefault();
  var s=$('senha').value.trim();
  if(!s){$('erroLogin').textContent='Digite a senha.';return;}
  carregar(s,false);
}
function sair(){lsDel('carvo_senha_piloto');SENHA='';D=null;FICHAS=null;matarGraficos();$('app').hidden=true;$('login').hidden=false;$('senha').value='';$('senha').focus();}

window.addEventListener('load',function(){
  aplicarTema(lsGet('carvo_tema')==='dark'?'dark':'light');
  if(lsGet('carvo_menu')==='1')document.body.classList.add('recolhido');
  montarMenu();
  document.body.addEventListener('click',function(ev){
    var t=ev.target; if(!t.closest)return;
    var b;
    if((b=t.closest('[data-tema]'))){aplicarTema(b.dataset.tema);return;}
    if((b=t.closest('button.grupo'))){clicarGrupo(b.dataset.g);return;}
    if((b=t.closest('[data-ext]'))){abrirExterno(b.dataset.ext);return;}
    if((b=t.closest('[data-ficha]'))){var kf=b.dataset.ficha;FICHA_ABERTAS[kf]=!FICHA_ABERTAS[kf];pintarFichas();return;}
    if((b=t.closest('#lateral [data-v]'))){irPara(b.dataset.v);return;}
    if((b=t.closest('[data-mes]'))){MES=b.dataset.mes;desenhar();return;}
    if(t.closest('#btnRecolher')){recolher();return;}
    if(t.closest('#btnGaveta')){document.body.classList.toggle('gaveta');return;}
    if(t.closest('#cfgMenu')){recolher();return;}
    if(t.closest('#cfgSair')){sair();return;}
    if(t.closest('#btnAtualizar')){if(SENHA){$('carregando').hidden=false;carregar(SENHA,true);}return;}
    if(document.body.classList.contains('gaveta')&&t===document.body)document.body.classList.remove('gaveta');
  });
  document.body.addEventListener('change',function(ev){if(!ev.target)return;if(ev.target.id==='selUni'){UNI=ev.target.value;desenhar();}if(ev.target.id==='fichaG'){FICHA_G=ev.target.value;pintarFichas();}});
  document.body.addEventListener('input',function(ev){if(ev.target&&ev.target.id==='fichaQ'){FICHA_Q=ev.target.value;pintarFichas();}});
  var salva=lsGet('carvo_senha_piloto');
  if(salva){$('senha').value=salva;$('carregando').hidden=false;carregar(salva,true);}
});
</script>
