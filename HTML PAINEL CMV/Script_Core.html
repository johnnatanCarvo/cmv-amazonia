function getCustoUnitario(nomeProduto) {
  if (!nomeProduto) return null;
  // Busca na tabela dinâmica (teorico > perdas > fixo) — exata
  if (_abcCustoProd[nomeProduto] !== undefined) return _abcCustoProd[nomeProduto];
  // Busca case-insensitive
  const upper = nomeProduto.toUpperCase().trim();
  for (const [k, v] of Object.entries(_abcCustoProd)) {
    if (k.toUpperCase().trim() === upper) return v;
  }
  return null;
}

function normalizarFilial(nome) {
  if (!nome) return null;
  const n = nome.toString().toUpperCase().trim();
  for (const cfg of FILIAIS_CONFIG) {
    if (cfg.termos.some(t => n.includes(t.toUpperCase()))) return cfg.chave;
  }
  return n;
}

// Define se uma linha do Estoque Inicial/Final pertence à LOJA física ou ao CD DELALE,
// com base na coluna "Centro est." (LOJA = loja; CENTRAL/PRODUÇÃO/CÂMARA FRIA = CD).
// Sem a coluna (arquivo antigo), mantém o comportamento anterior (tudo na filial).
function _destinoPorCentroEst(row, filialNormalizada) {
  const centro = findStr(row, ['centro est.','centro est','centro de estoque','centro']).toUpperCase().trim();
  if (!centro) return filialNormalizada;
  return centro === 'LOJA' ? filialNormalizada : FILIAL_CD;
}
// Regra de negócio: compras da Duque vão pro CD, EXCETO Água de Coco (fica na própria Duque)
function _destinoCompra(filialOrigem, produto) {
  if (filialOrigem !== 'DUQUE') return filialOrigem;
  return String(produto||'').toUpperCase().includes('AGUA DE COCO') ? 'DUQUE' : FILIAL_CD;
}

// ── CMV por Produto (Est. Inicial + Compras − Est. Final) ──────────────────
let _cmvProdutoBase = {}; // { filial: { produto: {qtdCompras, ei, qtdEi, compras, ef, qtdEf} } }
function compilarCmvPorProduto() {
  _cmvProdutoBase = {};
  const add = (filial, produto, campo, valor) => {
    if (!_cmvProdutoBase[filial]) _cmvProdutoBase[filial] = {};
    if (!_cmvProdutoBase[filial][produto]) _cmvProdutoBase[filial][produto] = {qtdCompras:0, ei:0, qtdEi:0, compras:0, ef:0, qtdEf:0};
    _cmvProdutoBase[filial][produto][campo] += valor;
  };
  if (dados.ei) dados.ei.forEach(r => {
    const tp = findStr(r, ['tp. movto.','tp. movto']).toLowerCase();
    if (!tp.includes('invent')) return;
    const f = normalizarFilial(findStr(r,['filial'])); if(!f) return;
    const destino = _destinoPorCentroEst(r, f);
    const prod = findStr(r,['produto']); if (!prod) return;
    add(destino, prod, 'ei', findVal(r,['custo total']));
    add(destino, prod, 'qtdEi', findQtd(r, ['movimento']));
  });
  if (dados.ef) dados.ef.forEach(r => {
    const tp = findStr(r, ['tp. movto.','tp. movto']).toLowerCase();
    if (!tp.includes('invent')) return;
    const f = normalizarFilial(findStr(r,['filial'])); if(!f) return;
    const destino = _destinoPorCentroEst(r, f);
    const prod = findStr(r,['produto']); if (!prod) return;
    add(destino, prod, 'ef', findVal(r,['custo total']));
    add(destino, prod, 'qtdEf', findQtd(r, ['movimento']));
  });
  if (dados.compras) dados.compras.forEach(r => {
    const f = normalizarFilial(findStr(r,['filial'])); if(!f) return;
    const prod = findStr(r,['produto']); if (!prod) return;
    const destino = _destinoCompra(f, prod);
    add(destino, prod, 'compras', findVal(r,['total','valor total','custo total','total (r$)']));
    add(destino, prod, 'qtdCompras', findQtd(r));
  });
}
// Soma o valor de Transferências do relatório Cloudfy por filial.
// Regra: só Tp. movto. = 'Transferência' (ignora 'Saldo anterior....') e só Centro est. = 'LOJA'
// (exclui Produção/Central da Duque, que é o CD/Matriz híbrido — essas movimentações não
// entram como transferência de loja, ficam de fora do cálculo).
// Sinal: Entradas > 0 → soma (entrou produto na loja); Saidas != 0 → subtrai (saiu produto da loja).
// Normaliza código de referência pra string sem decimais (evita "100126" != "100126.0")
function _normCodigo(v) {
  const s = String(v||'').trim();
  const n = parseFloat(s.replace(',','.'));
  return isNaN(n) ? s : String(Math.round(n));
}

// Mapa Cód. ref. -> Custo médio, vindo do relatório "Manutenção de Produtos" (fonte confiável)
function _mapaCustoMedioMestre() {
  const mapa = {};
  if (!dados.produtosMestre) return mapa;
  dados.produtosMestre.forEach(r => {
    const cod   = _normCodigo(findStr(r, ['cód. ref.','cod. ref.']));
    const custo = findVal(r, ['custo médio','custo medio']);
    if (cod && custo > 0) mapa[cod] = custo;
  });
  return mapa;
}

// Detecta se o relatório de Transferências deste mês está com o bug conhecido do Cloudfy
// (custo unit. errado nas linhas de Entrada). Compara o custo unit. de cada linha de Entrada
// contra o Custo médio do mestre — se a maioria bater (até 20% de desvio, que é variação
// normal do custo médio), o relatório está confiável este mês.
let _transferenciasRelatorioConfiavel = null; // guarda o resultado do diagnóstico do mês atual
function _relatorioTransferenciasConfiavel(custoMedioMapa) {
  const porFilial = {}; // { filial: true/false } — diagnóstico individual por filial
  if (!dados.transferencias) return porFilial;
  const LIMIAR_DESVIO = 0.20;      // 20% de tolerância por linha
  const LIMIAR_DIVERGENCIA = 0.40; // até 40% das linhas podem divergir e ainda considerar confiável
  const statsPorFilial = {}; // { filial: {comparaveis, divergentes} }

  dados.transferencias.forEach(r => {
    const tipo = findStr(r, ['tp. movto.','tp. movto']).toLowerCase();
    if (!tipo.startsWith('transfer')) return;
    const centro = findStr(r, ['centro est.','centro est']).toUpperCase().trim();
    if (centro !== 'LOJA') return;
    const qtdEntrada = findVal(r, ['entradas']);
    if (qtdEntrada <= 0) return; // o bug histórico é só nas linhas de Entrada

    const filial = normalizarFilial(findStr(r, ['filial']));
    if (!filial) return;

    const cod = _normCodigo(findStr(r, ['cód. ref.','cod. ref.']));
    const custoMedio = custoMedioMapa[cod];
    if (!custoMedio) return;
    const custoUnitRelatorio = findVal(r, ['custo unit.','custo unitario']);
    if (!custoUnitRelatorio) return;

    const st = statsPorFilial[filial] || (statsPorFilial[filial] = {comparaveis:0, divergentes:0});
    st.comparaveis++;
    const desvio = Math.abs(custoUnitRelatorio - custoMedio) / custoMedio;
    if (desvio > LIMIAR_DESVIO) st.divergentes++;
  });

  Object.keys(statsPorFilial).forEach(f => {
    const st = statsPorFilial[f];
    porFilial[f] = st.comparaveis === 0 ? false : (st.divergentes / st.comparaveis) < LIMIAR_DIVERGENCIA;
  });

  return porFilial; // filiais sem linhas comparáveis não entram aqui e caêm no fallback seguro (mestre)
}

// Soma o valor de Transferências do relatório Cloudfy por filial.
// Detecta automaticamente, POR FILIAL, se o custo unit. do relatório está confiável este mês:
//  - Confiável  → usa o Custo total do próprio relatório (é o custo médio real do mês, mais preciso).
//  - Bugado     → usa quantidade x Custo médio do mestre "Manutenção de Produtos" (fallback seguro).
// Cada filial é avaliada de forma independente: se só 3 das 4 lojas estiverem com o custo
// corrompido, apenas essas 3 usam o fallback — a filial confiável continua usando o próprio
// Custo total do relatório, que é mais preciso.
// Regra mantida em ambos os casos: só Tp. movto. = 'Transferência' e Centro est. = 'LOJA'.
function _mapaTransferenciasRelatorio() {
  const mapa = {};
  if (!dados.transferencias) return mapa;
  const custoMedioMapa = _mapaCustoMedioMestre();
  const confiavelPorFilial = _relatorioTransferenciasConfiavel(custoMedioMapa);
  _transferenciasRelatorioConfiavel = confiavelPorFilial;
  const resumoDiag = Object.keys(confiavelPorFilial).length
    ? Object.keys(confiavelPorFilial).map(f => f + ':' + (confiavelPorFilial[f] ? 'OK' : 'BUG')).join(', ')
    : 'sem dados comparáveis';
  console.log('[Transferências] Diagnóstico por filial este mês → ' + resumoDiag);

  dados.transferencias.forEach(r => {
    const tipo = findStr(r, ['tp. movto.','tp. movto']).toLowerCase();
    if (!tipo.startsWith('transfer')) return; // ignora "Saldo anterior...."

    const centro = findStr(r, ['centro est.','centro est']).toUpperCase().trim();
    if (centro !== 'LOJA') return;

    const filial = normalizarFilial(findStr(r, ['filial']));
    if (!filial) return;

    const qtdEntrada = findVal(r, ['entradas']);
    const qtdSaida    = findVal(r, ['saidas']); // já vem negativo no arquivo
    let valor;

    const confiavel = confiavelPorFilial[filial] === true; // sem info da filial → fallback seguro
    if (confiavel) {
      const custoTotal = findVal(r, ['custo total']);
      valor = qtdEntrada > 0 ? custoTotal : (qtdSaida !== 0 ? -custoTotal : 0);
    } else {
      const cod = _normCodigo(findStr(r, ['cód. ref.','cod. ref.']));
      const custoMedio = custoMedioMapa[cod];
      if (!custoMedio) return; // sem custo médio confiável no mestre, ignora a linha
      valor = (qtdEntrada + qtdSaida) * custoMedio;
    }

    mapa[filial] = (mapa[filial] || 0) + valor;
  });
  return mapa;
}
function parseNumber(val) {
  if (val === undefined || val === null || val === '') return 0;
  if (typeof val === 'number') return val;
  let str = String(val).replace(/[R$\s]/g, '').trim();
  if (str.includes(',') && str.includes('.')) str = str.replace(/\./g, '').replace(',', '.');
  else if (str.includes(',')) str = str.replace(',', '.');
  return parseFloat(str) || 0;
}

function findVal(row, keysPossiveis) {
  for (const k of keysPossiveis) {
    const targetKey = k.toLowerCase().trim();
    if (row[targetKey] !== undefined && row[targetKey] !== null && String(row[targetKey]).trim() !== '') {
      return parseNumber(row[targetKey]);
    }
  }
  return 0;
}

function findStr(row, keysPossiveis) {
  for (const k of keysPossiveis) {
    const targetKey = k.toLowerCase().trim();
    if (row[targetKey] !== undefined && row[targetKey] !== null && String(row[targetKey]).trim() !== '') {
      return String(row[targetKey]).trim();
    }
  }
  return '';
}

// Busca quantidade com fallback amplo: tenta primeiro os aliases prioritários do contexto (ex.:
// "Movimento" no relatório de Estoque Inicial/Final), depois os aliases genéricos e, por fim,
// qualquer coluna cujo nome contenha "qtd" ou "quant" — cobre variações de cabeçalho do Cloudfy
// não previstas nas listas fixas.
function findQtd(row, aliasesPrioritarios) {
  const aliases = (aliasesPrioritarios||[]).concat(['qtd.','qtd','quantidade','qtde.','qtde','qtd estoque','qtde estoque','quantidade estoque','saldo qtd.','saldo qtd','saldo']);
  const v = findVal(row, aliases);
  if (v) return v;
  for (const k in row) {
    if (/qtd|quant/.test(k)) {
      const n = parseNumber(row[k]);
      if (n) return n;
    }
  }
  return 0;
}

function decodeHtmlEntities(str) {
  return String(str).replace(/&quot;/g,'"').replace(/&amp;/g,'&').replace(/&#39;/g,"'").replace(/&lt;/g,'<').replace(/&gt;/g,'>');
}

function extrairDtLabel(rawDate) {
  if (!rawDate) return '?';
  if (typeof rawDate === 'string' && rawDate.includes('T')) {
    const d = new Date(rawDate);
    return String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0');
  }
  if (rawDate instanceof Date) {
    return String(rawDate.getDate()).padStart(2,'0') + '/' + String(rawDate.getMonth()+1).padStart(2,'0');
  }
  const s = String(rawDate).trim();
  return s.length >= 5 ? s.substring(0, 5) : '?';
}

function _idFilial(f) {
  return f.toLowerCase().replace(/\s+/g,'_').replace(/[^a-z0-9_]/g,'');
}

// Preenche o formulário com os valores já carregados do servidor pro mês ativo
function preencherFormularioLancamentos() {
  const mes = _mesAtualDrive();
  if (mes === '—') return;

  const fonte = lancamentosManuaisAtivos;

  FILIAIS_ORDEM_LANC.forEach(f => {
    const idF = _idFilial(f);
    const elP = document.getElementById('lanc-perdas-' + idF);
    const elT = document.getElementById('lanc-transf-' + idF);
    if (elP) { const v = parseFloat(fonte?.perdas?.[f]); elP.value = (!isNaN(v) && v > 0) ? v : ''; }
    if (elT) { const v = parseFloat(fonte?.transf?.[f]); elT.value = (!isNaN(v) && v !== 0) ? v : ''; }
  });

  const elSite = document.getElementById('lanc-site');
  if (elSite) { const v = parseFloat(fonte?.vendas_site); elSite.value = (!isNaN(v) && v > 0) ? v : ''; }

  const elFatCD = document.getElementById('lanc-fat-cd');
  if (elFatCD) { const v = parseFloat(fonte?.fat_cd_transf); elFatCD.value = (!isNaN(v) && v > 0) ? v : ''; }

  atualizarTotaisLanc();
  _atualizarStatusLancamentos(mes, fonte);
}

function _atualizarStatusLancamentos(mes, fonte) {
  const el = document.getElementById('lanc-status');
  if (!el) return;
  const temDados = fonte && (
    Object.values(fonte.perdas || {}).some(v => v > 0) ||
    Object.values(fonte.transf || {}).some(v => v !== 0) ||
    parseFloat(fonte.vendas_site) > 0 ||
    parseFloat(fonte.fat_cd_transf) > 0
  );
  el.style.display = 'flex';
  if (temDados) {
    el.className = 'lanc-status-bar loaded';
    el.innerHTML = '✅ Lançamentos carregados da planilha para <strong>' + mes + '</strong>. Edite e salve para atualizar.';
  } else {
    el.className = 'lanc-status-bar empty';
    el.innerHTML = '⚠️ Nenhum lançamento encontrado para <strong>' + mes + '</strong>. Preencha os campos abaixo.';
  }
}

function atualizarTotaisLanc() {
  let totP = 0, totT = 0;
  FILIAIS_ORDEM_LANC.forEach(f => {
    const idF = _idFilial(f);
    totP += parseFloat(document.getElementById('lanc-perdas-' + idF)?.value) || 0;
    totT += parseFloat(document.getElementById('lanc-transf-' + idF)?.value) || 0;
  });
  document.getElementById('lanc-total-perdas').textContent = fmtR(totP);
  document.getElementById('lanc-total-transf').textContent = fmtR(totT);
}

// Lê os inputs e monta o objeto de lançamentos
function _lerInputsLancamentos() {
  const obj = { perdas: {}, transf: {}, vendas_site: 0 };
  FILIAIS_ORDEM_LANC.forEach(f => {
    const idF = _idFilial(f);
    const p = parseFloat(document.getElementById('lanc-perdas-' + idF)?.value) || 0;
    const t = parseFloat(document.getElementById('lanc-transf-' + idF)?.value) || 0;
    if (p !== 0) obj.perdas[f] = p;
    if (t !== 0) obj.transf[f] = t;
  });
  obj.vendas_site = parseFloat(document.getElementById('lanc-site')?.value) || 0;
  obj.fat_cd_transf = parseFloat(document.getElementById('lanc-fat-cd')?.value) || 0;
  return obj;
}

    .withSuccessHandler(function() {

function _aguardarGoogleScript(tentativa) {
  const MAX = 20; // tenta por até 10s (20 × 500ms)
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    carregarTudo(false);
    return;
  }
  if (tentativa >= MAX) {
    document.getElementById('drive-status-msg').textContent =
      '⚠️ Abra pelo link do Web App no Google Apps Script. Não funciona abrindo o HTML diretamente.';
    return;
  }
  setTimeout(() => _aguardarGoogleScript(tentativa + 1), 500);
}

// Carrega TODOS os meses de uma vez. Substitui puxarDadosDrive.
function carregarTudo(forcar) {
  const statusEl  = document.getElementById('drive-status-msg');
  const loadingEl = document.getElementById('drive-loading');
  const subEl     = document.getElementById('loading-sub');
  const btnReproc = document.getElementById('btn-reprocessar');
  const cardsGrid = document.getElementById('meses-cards-grid');

  if (forcar && Object.keys(dadosPorMes).length > 0) {
    if (!confirm('Reprocessar vai ignorar o cache e reler todos os arquivos do Drive. Pode demorar alguns minutos. Continuar?')) return;
  }

  statusEl.textContent = forcar ? 'Reprocessando arquivos (sem cache)...' : 'Carregando dados do Drive...';
  loadingEl.style.display = 'flex';
  if (subEl) subEl.textContent = forcar ? 'Ignorando cache — lendo arquivos...' : 'Verificando cache e sincronizando...';
  btnReproc.disabled = true;
  if (cardsGrid) cardsGrid.style.display = 'none';

  const inicio = Date.now();

  google.script.run
    .withSuccessHandler(function(todosOsDados) {
      const elapsed = Date.now() - inicio;
      loadingEl.style.display = 'none';
      btnReproc.disabled = false;

      if (!todosOsDados || Object.keys(todosOsDados).length === 0) {
        statusEl.textContent = '⚠️ Nenhuma pasta de mês encontrada na raiz do Drive. Verifique a estrutura de pastas.';
        mostrarAlerta('Nenhuma pasta de mês encontrada. Certifique-se de que existem subpastas como "4. ABRIL 2026" dentro da pasta raiz CMV.');
        return;
      }

      dadosPorMes = todosOsDados;
      const meses = Object.keys(dadosPorMes);

      // Popula seletor global no topbar
      const sel = document.getElementById('mes-global-select');
      sel.innerHTML = meses.map(m => `<option value="${m}">${m}</option>`).join('');
      document.getElementById('mes-filter-wrap').style.display = 'flex';

      // Renderiza cards de meses
      _renderizarCardsMeses(meses);
      if (cardsGrid) cardsGrid.style.display = 'block';

      const badge = document.getElementById('cache-badge');
      if (elapsed < 8000 && !forcar) {
        badge.style.display = 'inline-block';
        badge.textContent = `⚡ Cache (${(elapsed/1000).toFixed(1)}s)`;
      } else { badge.style.display = 'none'; }

      statusEl.textContent = `✅ ${meses.length} mês(es) carregado(s) em ${(elapsed/1000).toFixed(1)}s. Use o seletor acima para alternar entre meses.`;

      // Carrega o histórico compartilhado (Comparativo Mensal/Sparklines/Ranking ABC
      // anterior) ANTES de ativar o mês, pra já nascer com os deltas "vs mês anterior"
      // certos na primeira renderização.
      google.script.run
        .withSuccessHandler(function(historico) {
          _histServidor = historico || { HIST_CMV: {}, HIST_COMPRAS: {}, HIST_CMV_FILIAL: {}, ABC_HIST: {} };
          mudarMesAtivo(meses[0]);
        })
        .withFailureHandler(function(err) {
          console.warn('[Histórico] Falha ao carregar do servidor, seguindo sem histórico: ' + err.message);
          mudarMesAtivo(meses[0]);
        })
        .carregarHistoricoServidor();
    })
    .withFailureHandler(function(err) {
      loadingEl.style.display = 'none';
      btnReproc.disabled = false;
      const msg = err.message || JSON.stringify(err);
      statusEl.textContent = '❌ Erro: ' + msg;
      mostrarAlerta('Falha ao carregar dados: ' + msg);
      console.error('[CMV] carregarTudo failure:', err);
    })
    .obterTodosOsDados(forcar);
}

// Muda o mês ativo e recalcula o painel instantaneamente
function mudarMesAtivo(nomeLabel) {
  if (!nomeLabel || !dadosPorMes[nomeLabel]) return;

  mesAtivoNome = nomeLabel;
  dados = dadosPorMes[nomeLabel];

  // Sincroniza lançamentos em memória (fonte: servidor, planilha "Lançamentos")
  lancamentosManuaisAtivos = dados.lancamentosManuais || { perdas: {}, transf: {}, vendas_site: 0 };

  // Atualiza selects
  const sel = document.getElementById('mes-global-select');
  if (sel) sel.value = nomeLabel;

  // Marca card ativo
  document.querySelectorAll('.mes-card').forEach(c => {
    c.classList.toggle('ativo', c.dataset.mes === nomeLabel);
  });

  // Atualiza formulário de lançamentos
  preencherFormularioLancamentos();

  // Recalcula o painel
  if (dados.ei || dados.ef || dados.compras || dados.vendas) {
    executarCalculosPainel();
    trocarAba('cmv');
  }
}

// Renderiza cards de meses na aba Drive
function _renderizarCardsMeses(meses) {
  const container = document.getElementById('meses-cards');
  if (!container) return;
  container.innerHTML = meses.map(m => {
    const pac = dadosPorMes[m];
    const temErro = !!pac?.erro;
    const arquivos = [pac?.ei?'EI':'', pac?.ef?'EF':'', pac?.compras?'Compras':'', pac?.vendas?'Vendas':'', pac?.teorico?'Teórico':'', pac?.perdas?'Perdas':''].filter(Boolean);
    return `<div class="mes-card ${temErro?'erro':''}" data-mes="${m}" onclick="mudarMesAtivo('${m}')">
      <div class="mes-card-nome">${m}</div>
      <div class="mes-card-info">${temErro ? '⚠️ Erro: '+pac.erro : arquivos.join(' · ') || 'Sem arquivos'}</div>
      <div class="mes-card-badge">${temErro ? 'Erro' : arquivos.length + ' arquivo(s)'}</div>
    </div>`;
  }).join('');
}

// ─── CÁLCULOS PRINCIPAIS ──────────────────────────────────────────────────────
function executarCalculosPainel() {
  try { _calcularInterno(); }
  catch(e) { mostrarAlerta('Erro ao calcular painel: ' + e.message); console.error('[CMV]', e); }
}

function _calcularInterno() {
  _deduplicarHistoricoServidor();
  const eiMapa = {}, efMapa = {}, compMapa = {}, vendMapa = {}, teoricoMapa = {};
  const vendFisicaMapa = {}, vendDeliveryMapa = {};

  // EI/EF: "Centro est." = LOJA fica na própria filial; CENTRAL/PRODUÇÃO/CÂMARA FRIA → CD DELALE
  if (dados.ei) dados.ei.forEach(r => {
    const tp = findStr(r, ['tp. movto.','tp. movto']).toLowerCase();
    if (tp.includes('invent')) {
      const f = normalizarFilial(findStr(r,['filial'])); if(!f) return;
      const destino = _destinoPorCentroEst(r, f);
      eiMapa[destino] = (eiMapa[destino]||0) + findVal(r,['custo total']);
    }
  });

  if (dados.ef) dados.ef.forEach(r => {
    const tp = findStr(r, ['tp. movto.','tp. movto']).toLowerCase();
    if (tp.includes('invent')) {
      const f = normalizarFilial(findStr(r,['filial'])); if(!f) return;
      const destino = _destinoPorCentroEst(r, f);
      efMapa[destino] = (efMapa[destino]||0) + findVal(r,['custo total']);
    }
  });

  // Compras: cada loja compra seu próprio insumo — EXCETO "DELALE - DUQUE", cuja compra
  // hoje é toda feita pelo CD (Produção/Central) e vai pra CD DELALE, SALVO compras de
  // "Água de Coco", que ficam registradas na própria loja Duque.
  if (dados.compras) dados.compras.forEach(r => {
    const f = normalizarFilial(findStr(r,['filial'])); if(!f) return;
    const prod = findStr(r,['produto']);
    const destino = _destinoCompra(f, prod);
    compMapa[destino] = (compMapa[destino]||0) + findVal(r,['total','valor total','custo total','total (r$)']);
  });

  // Vendas: continuam por loja (CD não vende diretamente). A quebra Loja Física x Delivery
  // é só para exibição — o CMV% segue calculado sobre o faturamento TOTAL da filial,
  // já que o custo (produção/estoque) não é rastreado separadamente por canal.
  if (dados.vendas) dados.vendas.forEach(r => {
    const filialOrig = findStr(r,['filial']);
    const f = normalizarFilial(filialOrig); if(!f) return;
    const valor = findVal(r,['total','valor total','faturamento']);
    vendMapa[f] = (vendMapa[f]||0) + valor;
    if (filialOrig.toUpperCase().includes('DELIVERY')) vendDeliveryMapa[f] = (vendDeliveryMapa[f]||0) + valor;
    else vendFisicaMapa[f] = (vendFisicaMapa[f]||0) + valor;
  });

  if (dados.teorico) Object.assign(teoricoMapa, calcularTeoricoMapa(dados.teorico));

  let totalPerdasRs=0, totalPerdasVend=0, totalPerdasVol=0, totalPerdasKg=0;
  const mapaPerdasFilial={}, mapaPerdasFilialSist={};
  decompDetalhes=[]; perdasDetalhadas=[];

  if (dados.perdas) {
    dados.perdas.forEach(r => {
      const perdasRs   = Math.abs(findVal(r,['perdas em r$']));
      const perdasVend = Math.abs(findVal(r,['perdas em vendas']));
      const volume     = Math.abs(findVal(r,['perdas em volume']));
      const perdaKg    = Math.abs(findVal(r,['perda em kg']));
      const custoUnit  = Math.abs(findVal(r,['custo']));
      if (perdasRs===0 && perdasVend===0 && volume===0) return;
      const filial  = normalizarFilial(findStr(r,['filial'])) || 'NÃO IDENTIFICADA';
      const produto = findStr(r,['produto']) || 'Sem Nome';
      const motivo  = findStr(r,['motivo']) || 'Não Informado';
      const grupo   = findStr(r,['grupo']) || 'Sem Grupo';
      const unidade = findStr(r,['unidade']) || '';
      const dtLabel = extrairDtLabel(findStr(r,['data']) || '');
      mapaPerdasFilial[filial]     = (mapaPerdasFilial[filial]||0) + perdasRs;
      mapaPerdasFilialSist[filial] = (mapaPerdasFilialSist[filial]||0) + perdasRs;
      totalPerdasRs+=perdasRs; totalPerdasVend+=perdasVend; totalPerdasVol+=volume; totalPerdasKg+=perdaKg;
      decompDetalhes.push({filial,produto,motivo,custo:perdasRs});
      perdasDetalhadas.push({filial,produto,motivo,grupo,volume,unidade,custoUnit,perdasRs,perdasVend,perdaKg,dtLabel});
    });
  }

  // Divisão Loja x CD dentro da Duque: o relatório de Perdas normal traz "DUQUE" com Loja e CD
  // JUNTOS (não tem coluna Centro est. pra separar). O relatório "Rel movimentação de estoque
  // Por Produto" tem essa coluna — usamos a PROPORÇÃO dele pra dividir o total que já está em
  // "DUQUE", sem adicionar valor novo (é rateio, não soma).
  if (dados.perdasCD) {
    let totalLojaDuque = 0, totalNaoLojaDuque = 0;
    const linhasPerdaCD = []; // produtos reais perdidos no CD, vindos do Rel. de Movimentação
    dados.perdasCD.forEach(r => {
      const tipo = findStr(r, ['tp. movto.','tp. movto']).toLowerCase();
      if (!tipo.startsWith('perda')) return;
      const filial = normalizarFilial(findStr(r,['filial']));
      if (filial !== 'DUQUE') return; // só a Duque mistura Loja/CD nesse jeito
      const centro = findStr(r, ['centro est.','centro est']).toUpperCase().trim();
      const custoTotal = Math.abs(findVal(r, ['custo total']));
      if (centro === 'LOJA') { totalLojaDuque += custoTotal; return; }
      totalNaoLojaDuque += custoTotal;
      linhasPerdaCD.push({
        produto: findStr(r,['produto']) || 'Sem Nome',
        motivo:  findStr(r,['tp. movto.','tp. movto']) || 'Não Informado',
        grupo:   findStr(r,['grupo']) || 'Sem Grupo',
        dtLabel: extrairDtLabel(findStr(r,['data']) || ''),
        custo:   custoTotal
      });
    });

    const totalMovimento = totalLojaDuque + totalNaoLojaDuque;
    if (totalMovimento > 0) {
      const propCD = totalNaoLojaDuque / totalMovimento;
      const duqueBrutoAtual = mapaPerdasFilial['DUQUE'] || 0; // Loja + CD juntos, vindo do relatório de Perdas
      const parcelaCD = duqueBrutoAtual * propCD;

      mapaPerdasFilial['DUQUE']       = duqueBrutoAtual - parcelaCD;
      mapaPerdasFilialSist['DUQUE']   = (mapaPerdasFilialSist['DUQUE']||0) - parcelaCD;
      mapaPerdasFilial[FILIAL_CD]     = (mapaPerdasFilial[FILIAL_CD]||0) + parcelaCD;
      mapaPerdasFilialSist[FILIAL_CD] = (mapaPerdasFilialSist[FILIAL_CD]||0) + parcelaCD;
      // totalPerdasRs não muda — é realocação entre filiais, não dinheiro novo.

      // Ajuste agregado (some/subtrai da Duque pra não contar em dobro). Fica de fora
      // da tabela "Top Produtos" (flag ajuste:true), mas continua nos gráficos/tabelas
      // por filial e por motivo, que precisam do total batendo.
      decompDetalhes.push({filial:'DUQUE', produto:'Ajuste: Rateio p/ CD (Produção/Central)', motivo:'Rateio Loja↔CD', custo:-parcelaCD});
      perdasDetalhadas.push({filial:'DUQUE', produto:'Ajuste: Rateio p/ CD', motivo:'Rateio Loja↔CD', grupo:'Ajuste', volume:0, unidade:'', custoUnit:0, perdasRs:-parcelaCD, perdasVend:0, perdaKg:0, dtLabel:'—', ajuste:true});

      // Produtos reais perdidos no CD, um por um. Reescala pra bater exatamente com
      // parcelaCD (o relatório de Perdas é a fonte oficial do total; o de Movimentação
      // só empresta a proporção por produto).
      const fatorAjuste = totalNaoLojaDuque > 0 ? (parcelaCD / totalNaoLojaDuque) : 0;
      linhasPerdaCD.forEach(l => {
        const perdasRsAjustado = l.custo * fatorAjuste;
        decompDetalhes.push({filial:FILIAL_CD, produto:l.produto, motivo:l.motivo, custo:perdasRsAjustado});
        perdasDetalhadas.push({filial:FILIAL_CD, produto:l.produto, motivo:l.motivo, grupo:l.grupo, volume:0, unidade:'', custoUnit:0, perdasRs:perdasRsAjustado, perdasVend:0, perdaKg:0, dtLabel:l.dtLabel});
      });
    }
  }

  // Adiciona perdas manuais dos lançamentos (lojas + CD)
  FILIAIS_ORDEM_LANC.forEach(f => {
    const perdaMan = getLancamento('perdas', f);
    if (perdaMan <= 0) return;
    mapaPerdasFilial[f] = (mapaPerdasFilial[f]||0) + perdaMan;
    totalPerdasRs += perdaMan;
    decompDetalhes.push({filial:f, produto:'Ajuste Manual', motivo:'Ajuste Manual', custo:perdaMan});
    perdasDetalhadas.push({filial:f, produto:'Ajuste Manual', motivo:'Ajuste Manual', grupo:'Lançamento Manual', volume:0, unidade:'', custoUnit:0, perdasRs:perdaMan, perdasVend:0, perdaKg:0, dtLabel:'—'});
  });

  // Vendas site somadas na DUQUE (loja física)
  const vendasSiteTotal = getLancamentoVendasSite();
  if (vendasSiteTotal > 0) {
    vendMapa['DUQUE'] = (vendMapa['DUQUE']||0) + vendasSiteTotal;
    vendFisicaMapa['DUQUE'] = (vendFisicaMapa['DUQUE']||0) + vendasSiteTotal;
  }

  // ── Linhas das 4 lojas ──────────────────────────────────────────────────
  const transfRelatorioMapa = _mapaTransferenciasRelatorio();
  const resultadosLojas = FILIAIS_ORDEM.map(f => {
    const ei=eiMapa[f]||0, ef=efMapa[f]||0, c=compMapa[f]||0, fat=vendMapa[f]||0;
    const teoricoRs   = teoricoMapa[f]||0;
    const perdaManual = getLancamento('perdas', f);
    const transf      = getLancamento('transf', f) + (transfRelatorioMapa[f]||0); // manual + relatório Cloudfy
    const perdaSist   = mapaPerdasFilialSist[f]||0;
    const perda       = perdaManual + perdaSist;
    const cmv         = ei + c + transf - ef - perda;
    const pct         = fat>0 ? (cmv/fat*100) : 0;
    const teoricoPct  = fat>0 ? (teoricoRs/fat*100) : 0;
    return {
      filial:f, ei, ef, c, perda, transf, cmv, fat, pct, mg:fat-cmv, teoricoRs, teoricoPct,
      fatFisica: vendFisicaMapa[f]||0, fatDelivery: vendDeliveryMapa[f]||0
    };
  }).filter(r => r.fat>0 || r.c>0 || r.ei>0);

  // ── CD DELALE — fora da tabela "CMV por Filial", mas entra no CMV Consolidado ──
  // DECISÃO DA DIRETORIA (reunião jul/2026, ajustada): o CD não aparece como linha na
  // tabela/gráficos "CMV por Filial" — só as 4 lojas. Mas o custo do CD (Estoque/Produção)
  // é parte real do CMV consolidado da rede, então volta a somar no "tot" (CMV Consolidado,
  // Lucro Bruto etc.). O faturamento do CD NÃO soma no tot.fat — é preço de transferência
  // interno, somar duplicaria a receita já contada nas lojas.
  const eiCD = eiMapa[FILIAL_CD]||0, efCD = efMapa[FILIAL_CD]||0, cCD = compMapa[FILIAL_CD]||0;
  const perdaSistCD   = mapaPerdasFilialSist[FILIAL_CD]||0;
  const perdaManualCD = getLancamento('perdas', FILIAL_CD);
  const perdaCD        = perdaManualCD + perdaSistCD;
  // Transferência do CD é o espelho negativo da soma das transferências das lojas
  // (o que sai do CD entra como transferência na loja, e vice-versa).
  const transfLojasSum = resultadosLojas.reduce((s,r)=>s+r.transf,0);
  const transfCD        = -transfLojasSum;
  const cmvCD           = eiCD + cCD + transfCD - efCD - perdaCD;
  _dadosBrutosCD = {
    ei: eiCD, ef: efCD, c: cCD, perda: perdaCD, transf: transfCD, cmv: cmvCD,
    fatManualTransferencia: getLancamentoFatCD()
  };

  const resultados = resultadosLojas; // tabela/gráficos "CMV por Filial": só lojas

  // ── CMV Consolidado — lojas + CD ────────────────────────────────────────────
  const totLojas = resultadosLojas.reduce((acc,r) => ({
    ei:acc.ei+r.ei, ef:acc.ef+r.ef, c:acc.c+r.c, transf:acc.transf+r.transf,
    perda:acc.perda+r.perda, cmv:acc.cmv+r.cmv, fat:acc.fat+r.fat,
    teoricoRs:acc.teoricoRs+r.teoricoRs
  }), {ei:0,ef:0,c:0,transf:0,perda:0,cmv:0,fat:0,teoricoRs:0});

  const tot = {
    ei: totLojas.ei + eiCD,
    ef: totLojas.ef + efCD,
    c:  totLojas.c  + cCD,
    transf: totLojas.transf + transfCD,
    perda:  totLojas.perda  + perdaCD,
    cmv:    totLojas.cmv    + cmvCD,
    fat: totLojas.fat, // faturamento do CD não soma aqui (evita duplicar receita)
    teoricoRs: totLojas.teoricoRs
  };
  tot.mg         = tot.fat - tot.cmv;
  tot.pct        = tot.fat>0 ? tot.cmv/tot.fat*100 : 0;
  tot.teoricoPct = tot.fat>0 ? tot.teoricoRs/tot.fat*100 : 0;
  tot.mgPct      = tot.fat>0 ? tot.mg/tot.fat*100 : 0;

  _kpiResultados = resultadosLojas;
  _kpiVendasSite = vendasSiteTotal;

  renderKpis(tot);
  renderTabela(resultados, tot);
  renderGraficosMestre(resultados, tot);
  processarPainelTeorico(resultadosLojas, tot);
  compilarCmvPorProduto();
  popularFiltroFilialCmvProduto();
  renderCmvPorProduto();

  if (perdasDetalhadas.length > 0) {
    document.getElementById('perdas-empty-state').style.display = 'none';
    document.getElementById('perdas-resultado').style.display   = 'block';
    renderPainelPerdas(totalPerdasRs, totalPerdasVend, totalPerdasVol, totalPerdasKg, tot.fat);
  } else {
    document.getElementById('perdas-empty-state').style.display = 'block';
    document.getElementById('perdas-resultado').style.display   = 'none';
  }

  compilarBasesAbc();

  document.getElementById('resultado').style.display = 'block';
  document.getElementById('cmv-empty').style.display = 'none';

  const labelMesAtual = _mesAtualDrive();
  salvarHistoricoCompras(labelMesAtual, dados.compras);
  salvarHistoricoCmvFilial(labelMesAtual, resultados, tot);
}
</script>
