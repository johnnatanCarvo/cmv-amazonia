<style>
:root {
  --brand:      #C8504E;
  --brand-dark: #1E2D4A;
  --bg:         #F4F6FB;
  --surface:    #FFFFFF;
  --surface2:   #EDF0F7;
  --border:     #E0E4F0;
  --green:      #0D9488;
  --red:        #DC4C4C;
  --blue:       #3563E9;
  --amber:      #D97706;
  --purple:     #7C3AED;
  --text:       #0D1117;
  --muted:      #64748B;
  --muted2:     #94A3B8;
  --sidebar-w:           240px;
  --sidebar-w-collapsed: 64px;
  --topbar-h:   60px;
  --radius:     14px;
  --shadow-sm:  0 1px 3px rgba(15,20,40,.06), 0 1px 2px rgba(15,20,40,.04);
  --shadow:     0 4px 16px rgba(15,20,40,.08), 0 1px 4px rgba(15,20,40,.05);
  --shadow-lg:  0 12px 40px rgba(15,20,40,.12), 0 4px 12px rgba(15,20,40,.06);
  --font-display: 'Bricolage Grotesque', sans-serif;
  --font-body:    'Figtree', sans-serif;
  --brand-primary:   var(--brand);
  --brand-secondary: var(--brand-dark);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 14px; min-height: 100vh; overflow: hidden; -webkit-font-smoothing: antialiased; }

.app-layout { display: flex; height: 100vh; overflow: hidden; }
.app-body   { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
.app-content { flex: 1; overflow-y: auto; padding: 32px 36px 48px; scroll-behavior: smooth; }
.app-content::-webkit-scrollbar { width: 5px; }
.app-content::-webkit-scrollbar-track { background: transparent; }
.app-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

.sidebar { width: var(--sidebar-w); flex-shrink: 0; background: var(--brand-dark); display: flex; flex-direction: column; transition: width .28s cubic-bezier(.4,0,.2,1); position: relative; z-index: 50; overflow: hidden; }
.sidebar.collapsed { width: var(--sidebar-w-collapsed); }
.sidebar-logo { display: flex; align-items: center; gap: 12px; padding: 20px 18px; border-bottom: 1px solid rgba(255,255,255,.1); min-height: var(--topbar-h); overflow: hidden; flex-shrink: 0; }
.sidebar-logo-text { display: flex; flex-direction: column; overflow: hidden; transition: opacity .2s, width .28s; white-space: nowrap; }
.sidebar-logo-name { font-family: var(--font-display); font-size: 17px; font-weight: 700; color: #FFF; letter-spacing: -.3px; }
.sidebar-logo-sub { font-size: 9px; color: rgba(255,255,255,.45); letter-spacing: 2.5px; text-transform: uppercase; margin-top: 2px; }
.sidebar.collapsed .sidebar-logo-text { opacity: 0; width: 0; pointer-events: none; }
.sidebar-toggle { position: fixed; top: calc(var(--topbar-h) / 2 - 12px + 60px); left: calc(var(--sidebar-w) - 14px); width: 28px; height: 28px; border-radius: 50%; background: var(--surface); border: 1.5px solid var(--border); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--muted); z-index: 200; transition: all .28s, left .28s; box-shadow: var(--shadow); }
.sidebar-toggle:hover { background: var(--brand); color: #fff; border-color: var(--brand); }
.sidebar-toggle.is-collapsed { left: calc(var(--sidebar-w-collapsed) - 14px); transform: rotate(180deg); }
.sidebar-nav { flex: 1; overflow-y: auto; padding: 16px 0; }
.sidebar-nav::-webkit-scrollbar { width: 0; }
.nav-group { margin-bottom: 8px; }
.nav-group-label { font-size: 9px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,.3); padding: 12px 20px 6px; white-space: nowrap; overflow: hidden; transition: opacity .2s; }
.sidebar.collapsed .nav-group-label { opacity: 0; }
.nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 18px; cursor: pointer; border-radius: 10px; margin: 1px 10px; transition: background .15s; border: 1px solid transparent; white-space: nowrap; overflow: hidden; color: rgba(255,255,255,.6); }
.nav-item:hover { background: rgba(255,255,255,.08); color: rgba(255,255,255,.9); }
.nav-item.active { background: rgba(200,80,78,.25); border-color: rgba(200,80,78,.4); color: #FFF; font-weight: 600; }
.nav-icon { font-size: 15px; flex-shrink: 0; width: 20px; text-align: center; }
.nav-label { font-size: 13px; font-weight: 500; transition: opacity .2s, width .28s; }
.sidebar.collapsed .nav-item { justify-content: center; padding: 11px; margin: 1px 8px; }
.sidebar.collapsed .nav-label { opacity: 0; width: 0; }

.topbar { height: var(--topbar-h); flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; border-bottom: 1px solid var(--border); background: var(--surface); gap: 12px; box-shadow: var(--shadow-sm); }
.breadcrumb { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); font-weight: 500; }
.breadcrumb-active { color: var(--text); font-weight: 600; }
.topbar-right { display: flex; align-items: center; gap: 10px; }
.period-badge { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 6px 14px; font-size: 11px; color: var(--muted); font-weight: 500; }
#periodo-label { color: var(--brand); font-weight: 700; }
.cache-badge { background: #ECFDF5; border: 1px solid #A7F3D0; border-radius: 8px; padding: 5px 10px; font-size: 10px; color: #059669; font-weight: 700; display: none; }
.theme-toggle { background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; padding: 5px 12px; cursor: pointer; display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); font-family: var(--font-body); transition: all .15s; }
.theme-toggle:hover { border-color: var(--brand); color: var(--brand); }

.section-title { font-family: var(--font-display); font-size: 20px; font-weight: 700; letter-spacing: -.4px; color: var(--text); margin-bottom: 20px; display: flex; align-items: center; gap: 12px; }
.section-title::after { content: ''; flex: 1; height: 1px; background: linear-gradient(to right, var(--border), transparent); }

.kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 32px; }
.kpi-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px 24px; position: relative; overflow: visible; box-shadow: var(--shadow-sm); transition: box-shadow .2s, transform .2s; }
.kpi-card:hover { box-shadow: var(--shadow); transform: translateY(-1px); }
.kpi-card::before { content: ''; position: absolute; top: 0; left: 0; bottom: 0; width: 4px; background: var(--accent, var(--brand)); border-radius: 4px 0 0 4px; z-index: 1; }
.kpi-card.green::before  { --accent: var(--green); }
.kpi-card.red::before    { --accent: var(--red); }
.kpi-card.blue::before   { --accent: var(--blue); }
.kpi-card.gold::before   { --accent: var(--amber); }
.kpi-card.purple::before { --accent: var(--purple); }
.kpi-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.8px; font-weight: 700; margin-bottom: 10px; display: block; }
.kpi-value { font-family: var(--font-display); font-size: 26px; font-weight: 700; letter-spacing: -.5px; color: var(--text); line-height: 1; }
.kpi-sub { font-size: 11px; color: var(--muted); margin-top: 6px; }
.kpi-badge { display: inline-block; padding: 3px 9px; border-radius: 6px; font-size: 10px; font-weight: 700; margin-top: 8px; letter-spacing: .5px; text-transform: uppercase; }
.badge-ok   { background: #ECFDF5; color: #059669; border: 1px solid #A7F3D0; }
.badge-warn { background: #FFFBEB; color: #D97706; border: 1px solid #FDE68A; }
.badge-bad  { background: #FEF2F2; color: #DC2626; border: 1px solid #FECACA; }

.table-wrapper { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow-x: auto; overflow-y: hidden; margin-bottom: 28px; box-shadow: var(--shadow-sm); }
table { width: 100%; border-collapse: collapse; white-space: nowrap; }
table thead th { padding: 12px 10px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); background: var(--surface2); text-align: right; border-bottom: 1px solid var(--border); }
table thead th:first-child { text-align: left; padding-left: 22px; }
table thead th.th-l { text-align: left !important; padding-left: 10px; }
table thead th.th-c { text-align: center !important; }
tbody tr { border-bottom: 1px solid var(--border); transition: background .12s; }
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: var(--surface2); }
tbody tr.row-ok   { border-left: 3px solid var(--green); }
tbody tr.row-warn { border-left: 3px solid var(--amber); }
tbody tr.row-bad  { border-left: 3px solid var(--red); }
tbody td { padding: 13px 10px; text-align: right; font-size: 13px; }
tbody td:first-child { text-align: left; padding-left: 22px; font-weight: 600; }
tbody td.td-l { text-align: left !important; padding-left: 10px; }
tbody td.td-c { text-align: center !important; }
.cmv-percent { font-weight: 700; padding: 4px 9px; border-radius: 6px; font-size: 12px; }
.cmv-ok   { background: #ECFDF5; color: #059669; }
.cmv-warn { background: #FFFBEB; color: #D97706; }
.cmv-bad  { background: #FEF2F2; color: #DC2626; }
.tfoot-row td { background: #F8FAFC; font-weight: 700; border-top: 2px solid var(--border); }

.charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 28px; }
.charts-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-bottom: 28px; }
.chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; min-height: 300px; display: flex; flex-direction: column; box-shadow: var(--shadow-sm); }
.chart-card h3 { font-family: var(--font-display); font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 16px; letter-spacing: -.2px; }
.chart-canvas-wrap { position: relative; flex: 1; width: 100%; min-height: 220px; }
.grupos-grid { display: grid; grid-template-columns: 1fr 1.2fr; gap: 20px; margin-bottom: 28px; }

.insights-section { margin-bottom: 32px; }
#insights-panel { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
.insight-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; display: flex; gap: 14px; align-items: flex-start; box-shadow: var(--shadow-sm); transition: box-shadow .2s; }
.insight-card:hover { box-shadow: var(--shadow); }
.insight-card.insight-green  { border-left: 4px solid var(--green); }
.insight-card.insight-red    { border-left: 4px solid var(--red); }
.insight-card.insight-yellow { border-left: 4px solid var(--amber); }
.insight-card.insight-blue   { border-left: 4px solid var(--blue); }
.insight-card.insight-purple { border-left: 4px solid var(--purple); }
.insight-card.insight-neutral { border-left: 4px solid var(--muted2); }
.insight-icon { font-size: 22px; flex-shrink: 0; margin-top: 1px; }
.insight-titulo { font-family: var(--font-display); font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 5px; letter-spacing: -.2px; }
.insight-texto { font-size: 12px; color: var(--muted); line-height: 1.65; }

.drive-control-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px; margin-bottom: 28px; display: flex; align-items: flex-end; gap: 20px; flex-wrap: wrap; box-shadow: var(--shadow-sm); }
.drive-select-group { display: flex; flex-direction: column; gap: 7px; }
.drive-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); font-weight: 700; }
.drive-select { background: var(--surface2); color: var(--text); border: 1.5px solid var(--border); border-radius: 10px; padding: 11px 18px; font-size: 13px; font-weight: 600; font-family: var(--font-body); outline: none; min-width: 240px; cursor: pointer; transition: border-color .15s; }
.drive-select:focus { border-color: var(--brand); }
.btn-drive-load { background: var(--brand-dark); color: #fff; border: none; border-radius: 10px; padding: 12px 28px; font-weight: 700; font-size: 13px; font-family: var(--font-body); cursor: pointer; display: flex; align-items: center; gap: 8px; transition: background .2s, transform .15s, box-shadow .2s; box-shadow: 0 4px 14px rgba(30,45,74,.3); letter-spacing: .2px; }
.btn-drive-load:hover { background: var(--brand); box-shadow: 0 4px 20px rgba(200,80,78,.4); transform: translateY(-1px); }
.btn-drive-load:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
.btn-reprocessar { background: transparent; color: var(--muted); border: 1.5px solid var(--border); border-radius: 10px; padding: 11px 18px; font-weight: 600; font-size: 12px; font-family: var(--font-body); cursor: pointer; transition: all .2s; }
.btn-reprocessar:hover { border-color: var(--amber); color: var(--amber); }

.loading-overlay { display: none; flex-direction: column; align-items: center; justify-content: center; padding: 72px 20px; text-align: center; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); }
.loading-overlay h3 { font-family: var(--font-display); font-weight: 600; color: var(--text); }
.loading-overlay p  { color: var(--muted); font-size: 12px; margin-top: 8px; }
.spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--brand); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── LANÇAMENTOS ─────────────────────────────────────────── */
.lanc-intro { background: #EFF6FF; border: 1px solid #BFDBFE; border-radius: 10px; padding: 14px 18px; margin-bottom: 24px; font-size: 12px; color: #1D4ED8; line-height: 1.65; display: flex; gap: 10px; align-items: flex-start; }
.lanc-status-bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 8px; margin-bottom: 20px; font-size: 12px; font-weight: 600; }
.lanc-status-bar.loaded  { background: #ECFDF5; border: 1px solid #A7F3D0; color: #059669; }
.lanc-status-bar.empty   { background: #FFFBEB; border: 1px solid #FDE68A; color: #D97706; }
.lanc-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 20px; margin-bottom: 20px; }
.lanc-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-sm); }
.lanc-card-header { display: flex; align-items: center; gap: 10px; padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--surface2); }
.lanc-card-header h3 { font-family: var(--font-display); font-size: 14px; font-weight: 700; color: var(--text); }
.lanc-card-header p  { font-size: 11px; color: var(--muted); margin-top: 1px; }
.lanc-fields { padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; }
.lanc-field-row { display: flex; gap: 10px; align-items: center; }
.lanc-field-row span { font-size: 12px; color: var(--muted); white-space: nowrap; min-width: 130px; font-weight: 500; }
.lanc-input { flex: 1; background: var(--surface2); border: 1.5px solid var(--border); border-radius: 8px; padding: 8px 12px; color: var(--text); font-family: var(--font-body); font-size: 13px; font-weight: 600; outline: none; text-align: right; width: 100%; transition: border-color .15s; }
.lanc-input:focus { border-color: var(--brand); }
.lanc-total-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; border-top: 1px solid var(--border); background: var(--surface2); }
.btn-salvar-lanc { display: block; width: 100%; background: var(--brand-dark); border: none; color: #fff; font-family: var(--font-body); font-weight: 700; font-size: 13px; border-radius: 10px; padding: 13px; cursor: pointer; text-transform: uppercase; letter-spacing: .8px; margin-top: 4px; transition: background .2s; }
.btn-salvar-lanc:hover { background: var(--brand); }
.lanc-saved-badge { display: none; margin-top: 10px; text-align: center; font-size: 12px; color: var(--green); font-weight: 600; }

.perdas-filtros { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; align-items: center; }
.perdas-select { background: var(--surface); border: 1.5px solid var(--border); border-radius: 8px; padding: 9px 14px; color: var(--text); font-family: var(--font-body); font-size: 13px; outline: none; transition: border-color .15s; }
.perdas-select:focus { border-color: var(--brand); }

.tree-container { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 28px; padding-bottom: 12px; align-items: start; margin-bottom: 28px; position: relative; min-height: 380px; }
#tree-svg { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 1; }
.tree-col { min-width: 0; z-index: 2; display: flex; flex-direction: column; gap: 8px; max-height: 460px; overflow-y: auto; padding: 4px; }
.tree-col-title { font-size: 11px; font-weight: 700; color: var(--muted); border-bottom: 1px solid var(--border); padding-bottom: 8px; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
.tree-item { background: var(--surface); border: 1.5px solid var(--border); border-radius: 10px; cursor: pointer; position: relative; overflow: hidden; display: flex; flex-direction: column; min-height: 54px; transition: border-color .15s, box-shadow .15s, transform .15s; }
.tree-item:hover { box-shadow: var(--shadow-sm); transform: translateX(2px); }
.tree-item.active { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(200,80,78,.15); }
.tree-item-bg { position: absolute; top: 0; left: 0; bottom: 0; background: var(--brand); opacity: .10; transition: width .3s; }
.tree-item-content { position: relative; z-index: 1; padding: 10px 14px; }
.tree-item-title { font-size: 11.5px; font-weight: 700; color: var(--text); line-height: 1.3; }
.tree-item-val   { font-size: 13px; font-weight: 600; color: var(--brand); margin-top: 3px; }

.abc-cmv-ok   { background: #ECFDF5; color: #059669; border: 1px solid #A7F3D0; padding: 2px 8px; border-radius: 5px; font-size: 10px; font-weight: 700; }
.abc-cmv-warn { background: #FFFBEB; color: #D97706; border: 1px solid #FDE68A; padding: 2px 8px; border-radius: 5px; font-size: 10px; font-weight: 700; }
.abc-cmv-bad  { background: #FEF2F2; color: #DC2626; border: 1px solid #FECACA; padding: 2px 8px; border-radius: 5px; font-size: 10px; font-weight: 700; }
.abc-a { background: #ECFDF5; color: #059669; border: 1px solid #A7F3D0; padding: 2px 8px; border-radius: 5px; font-size: 10px; font-weight: 700; }
.abc-b { background: #FFFBEB; color: #D97706; border: 1px solid #FDE68A; padding: 2px 8px; border-radius: 5px; font-size: 10px; font-weight: 700; }
.abc-c { background: #F8FAFC; color: var(--muted); border: 1px solid var(--border); padding: 2px 8px; border-radius: 5px; font-size: 10px; font-weight: 700; }
.abc-ifood-toggle { display: flex; gap: 4px; align-items: center; }
.abc-ifood-btn { background: var(--surface); border: 1.5px solid var(--border); border-radius: 7px; padding: 7px 13px; color: var(--muted); cursor: pointer; font-size: 12px; font-family: var(--font-body); font-weight: 600; transition: all .15s; white-space: nowrap; }
.abc-ifood-btn:hover { border-color: var(--amber); color: var(--amber); }
.abc-ifood-btn.active { background: var(--amber); color: #fff; border-color: var(--amber); }
.abc-ifood-label { font-size: 10px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; white-space: nowrap; }

.abc-controls { display: flex; gap: 10px; margin-bottom: 20px; align-items: center; flex-wrap: wrap; }
.abc-search, .abc-select { background: var(--surface); border: 1.5px solid var(--border); border-radius: 8px; padding: 9px 14px; color: var(--text); font-family: var(--font-body); font-size: 13px; outline: none; transition: border-color .15s; }
.abc-search { flex: 1; max-width: 300px; }
.abc-search:focus, .abc-select:focus { border-color: var(--brand); }
.topn-group { display: flex; gap: 4px; }
.topn-btn { background: var(--surface); border: 1.5px solid var(--border); border-radius: 7px; padding: 7px 14px; color: var(--muted); cursor: pointer; font-size: 12px; font-family: var(--font-body); font-weight: 600; transition: all .15s; }
.topn-btn:hover { border-color: var(--brand); color: var(--brand); }
.topn-btn.active { background: var(--brand); color: #fff; border-color: var(--brand); }
.tooltip-info { cursor: pointer; border-bottom: 1px dashed var(--muted2); }

.tab-panel { display: none; } .tab-panel.active { display: block; }
.empty-state { text-align: center; padding: 72px 20px; color: var(--muted); }
.empty-state .empty-icon { font-size: 44px; opacity: 0.25; margin-bottom: 14px; }
.empty-state p { font-size: 14px; line-height: 1.6; }
.warn-state { background: #FFFBEB; border: 1px solid #FDE68A; border-radius: 10px; padding: 16px 20px; margin-bottom: 18px; font-size: 12px; color: #92400E; }
.logo-img { height: 28px; object-fit: contain; flex-shrink: 0; border-radius: 4px; }

.prog-bar-wrap { display: flex; align-items: center; gap: 8px; }
.prog-bar { flex: 1; height: 6px; background: var(--surface2); border-radius: 3px; min-width: 60px; }
.prog-bar-fill { height: 100%; border-radius: 3px; background: var(--brand); }
.prog-bar-fill.green  { background: var(--green); }
.prog-bar-fill.amber  { background: var(--amber); }

.kpi-info-icon { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 50%; background: var(--surface2); border: 1px solid var(--border); font-size: 9px; color: var(--muted); cursor: pointer; font-style: normal; font-weight: 700; margin-left: 6px; vertical-align: middle; transition: background .15s, color .15s; user-select: none; }
.kpi-info-icon:hover { background: var(--brand); color: #fff; border-color: var(--brand); }
.kpi-info-icon.site-icon { background: #EFF6FF; color: #1D4ED8; border-color: #BFDBFE; }
.kpi-info-icon.site-icon:hover { background: #1D4ED8; color: #fff; border-color: #1D4ED8; }
